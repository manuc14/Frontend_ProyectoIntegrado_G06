version: '3.8'

services:
  build:
    image: node:20-alpine
    container_name: frontend_g06_build
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
    command: sh -c "npm ci && npm run build"
    
  serve:
    image: node:20-alpine
    container_name: frontend_g06_serve
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: npm start
    depends_on:
      - build

  test:
    image: node:20-alpine
    container_name: frontend_g06_test
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test -- --watch=false
    depends_on:
      - build

  sonarqube:
    image: node:20-alpine
    container_name: frontend_g06_sonar
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - SONAR_TOKEN=${SONAR_TOKEN}
      - SONAR_HOST_URL=${SONAR_HOST_URL}
    command: sh -c "npm install -g sonar-scanner && sonar-scanner -Dsonar.token=$${SONAR_TOKEN} -Dsonar.host.url=$${SONAR_HOST_URL} -Dsonar.projectKey=2025-g06-frontend -Dsonar.sources=src -Dsonar.exclusions='**/node_modules/**,**/dist/**,**/*.spec.ts'"
    depends_on:
      - build
