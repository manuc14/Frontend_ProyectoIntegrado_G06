trigger:
  branches:
    include:
      - Mario_dev
  paths:
    exclude:
      - README.md
      - .gitignore

variables:
  - name: DIST_PATH
    value: 'dist/frontend_g06/browser'     # Debe coincidir con hosting.public en firebase.json
  - group: firebase-secrets                 # Contiene: FIREBASE_TOKEN
  # (Sonar ya NO usa variables de grupo: va por Service Connection)

stages:
  # --- PREPARATION -----------------------------------------------------------
  - stage: Preparation
    displayName: 'Preparation and Validation'
    jobs:
      - job: PreparationJob
        displayName: 'Validate Environment'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "Repo: $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              docker version
              docker info | sed -n '1,25p'
            displayName: 'Show agent & Docker info'

          - script: |
              test -f .firebaserc   || { echo ".firebaserc not found"; exit 1; }
              test -f firebase.json || { echo "firebase.json not found"; exit 1; }
              echo "✓ Firebase config present"
            displayName: 'Validate Firebase config files'

  # --- BUILD (inside Docker) -------------------------------------------------
  - stage: Build
    displayName: 'Build Angular (Docker)'
    dependsOn: Preparation
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: 'Dockerized Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v "$(System.DefaultWorkingDirectory)":/app \
                -w /app node:20 \
                bash -lc "node -v && npm -v && npm ci && npm run build"
            displayName: 'npm ci + build inside Docker (node:20)'

          - script: |
              echo "Contenido de $(DIST_PATH):"
              ls -la "$(System.DefaultWorkingDirectory)/$(DIST_PATH)" || \
                { echo "Revisa DIST_PATH y el output del build"; exit 1; }
            displayName: 'Inspect dist output'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/$(DIST_PATH)'
              artifactName: 'dist'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  # --- SONAR (self-hosted + extensión oficial) ------------------------------
  - stage: Sonarqube
    displayName: 'SonarQube (UCLM/VPN)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
    - job: SonarJob
      pool: { name: 'UCLM-VPN' }
      steps:
        - checkout: self
        - task: SonarQubePrepare@6
          env:
            BUILD_SOURCEBRANCH: ''        # <- evita que Prepare setee sonar.branch.name
            BUILD_SOURCEBRANCHNAME: ''
            SYSTEM_PULLREQUEST_PULLREQUESTID: ''
          inputs:
            SonarQube: 'sonarqube-esi'
            scannerMode: 'CLI'
            configMode: 'manual'
            cliProjectKey: '2025-g06-frontend'
            cliProjectName: '2025-g06-frontend'
            cliSources: 'src'
            jdkVersionOption: '17'
            extraProperties: |
              sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
              sonar.sourceEncoding=UTF-8

        - task: SonarQubeAnalyze@6
          env:
            BUILD_SOURCEBRANCH: ''
            BUILD_SOURCEBRANCHNAME: ''
            SYSTEM_PULLREQUEST_PULLREQUESTID: ''
          inputs:
            jdkVersionOption: '17'

        - task: SonarQubePublish@6
          inputs:
            pollingTimeoutSec: '300'



  # --- DEPLOY (Hosted, NodeTool + Firebase CLI) ------------------------------
  - stage: Deploy
    displayName: 'Deploy to Firebase'
    dependsOn:
      - Build
      - Sonarqube
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Firebase Hosting'
        environment: 'Firebase'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self   # Necesario para tener firebase.json y .firebaserc

                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'dist'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifacts'

                - script: |
                    set -euxo pipefail
                    echo "Working directory: $(pwd)"
                    echo "Artifacts directory: $(System.ArtifactsDirectory)"
                    echo "Listing artifacts:"
                    ls -la "$(System.ArtifactsDirectory)/"
                    
                    # Copy from artifacts to hosting public directory
                    rm -rf dist/frontend_g06/browser
                    mkdir -p dist/frontend_g06
                    cp -r "$(System.ArtifactsDirectory)/dist/." dist/frontend_g06/browser
                    
                    echo "==> Verifying content in dist/frontend_g06/browser:"
                    ls -la dist/frontend_g06/browser/
                    test -f dist/frontend_g06/browser/index.html || { echo "ERROR: index.html not found!"; exit 1; }
                    test -s dist/frontend_g06/browser/index.html || { echo "ERROR: index.html is empty!"; exit 1; }
                    wc -c dist/frontend_g06/browser/index.html
                  displayName: 'Place artifact under hosting.public'

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'
                  displayName: 'Use Node 20.x'

                - script: |
                    set -eux
                    npm i -g firebase-tools
                    firebase --version
                  displayName: 'Install firebase-tools'

                - script: |
                    set -eux
                    echo "==> Pre-deploy verification:"
                    echo "Current directory: $(pwd)"
                    echo "firebase.json exists: $(test -f firebase.json && echo 'YES' || echo 'NO')"
                    echo "firebase.json content:"
                    cat firebase.json
                    echo ""
                    echo ".firebaserc exists: $(test -f .firebaserc && echo 'YES' || echo 'NO')"
                    echo ".firebaserc content:"
                    cat .firebaserc
                    echo ""
                    echo "dist/frontend_g06/browser contents:"
                    ls -lah dist/frontend_g06/browser/ || echo "Directory does not exist!"
                    echo ""
                    echo "Total files in dist/frontend_g06/browser:"
                    find dist/frontend_g06/browser -type f | wc -l
                    echo ""
                    echo "Checking public directory setting..."
                    grep -A 5 '"hosting"' firebase.json | grep -i public
                  displayName: 'Pre-deploy verification'

                - script: |
                    set -eux
                    echo "==> Starting Firebase deployment..."
                    echo "Site from firebase.json: $(grep -oP '"site":\s*"\K[^"]+' firebase.json)"
                    echo "Public directory from firebase.json: $(grep -oP '"public":\s*"\K[^"]+' firebase.json)"
                    echo ""
                    # Extract site ID from firebase.json and use it
                    SITE_ID=$(grep -oP '"site":\s*"\K[^"]+' firebase.json)
                    echo "Deploying to site: $SITE_ID"
                    echo ""
                    firebase deploy \
                      --only hosting:${SITE_ID} \
                      --project esimedia-frontend-g06 \
                      --non-interactive \
                      --token "${FIREBASE_TOKEN}" \
                      --debug 2>&1 | tee deploy.log
                    echo ""
                    DEPLOY_EXIT=$?
                    echo "==> Deploy exit code: $DEPLOY_EXIT"
                    exit $DEPLOY_EXIT
                  displayName: 'Deploy to Firebase Hosting'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)

                - script: |
                    echo "==> Post-deploy verification:"
                    firebase hosting:channel:list --project esimedia-frontend-g06 --token "${FIREBASE_TOKEN}" || echo "Could not list channels"
                  displayName: 'Post-deploy verification'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)
                  continueOnError: true
