trigger:
  branches:
    include:
      - Mario_dev
  paths:
    exclude:
      - README.md
      - .gitignore

variables:
  - name: DIST_PATH
    value: 'dist/frontend_g06/browser'     # Debe coincidir con hosting.public en firebase.json
  - group: firebase-secrets                 # Contiene: FIREBASE_TOKEN
  - group: sonarqube-secrets                # Contiene: SONAR_TOKEN, SONAR_HOST_URL

stages:
  # --- PREPARATION -----------------------------------------------------------
  - stage: Preparation
    displayName: 'Preparation and Validation'
    jobs:
      - job: PreparationJob
        displayName: 'Validate Environment'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "Repo: $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              docker version
              docker info | sed -n '1,25p'
            displayName: 'Show agent & Docker info'

          - script: |
              test -f .firebaserc   || { echo ".firebaserc not found"; exit 1; }
              test -f firebase.json || { echo "firebase.json not found"; exit 1; }
              echo "✓ Firebase config present"
            displayName: 'Validate Firebase config files'

  # --- BUILD (inside Docker) -------------------------------------------------
  - stage: Build
    displayName: 'Build Angular (Docker)'
    dependsOn: Preparation
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: 'Dockerized Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v "$(System.DefaultWorkingDirectory)":/app \
                -w /app node:20 \
                bash -lc "node -v && npm -v && npm ci && npm run build"
            displayName: 'npm ci + build inside Docker (node:20)'

          - script: |
              echo "Contenido de $(DIST_PATH):"
              ls -la "$(System.DefaultWorkingDirectory)/$(DIST_PATH)" || \
                { echo "Revisa DIST_PATH y el output del build"; exit 1; }
            displayName: 'Inspect dist output'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/$(DIST_PATH)'
              artifactName: 'dist'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  # --- SONAR (inside Docker) -------------------------------------------------
  - stage: Sonarqube
    displayName: 'SonarQube Code Analysis (Docker)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SonarqubeJob
        displayName: 'Sonar Scanner in container'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "SONAR_HOST_URL=$SONAR_HOST_URL"
              curl -I --max-time 5 "$SONAR_HOST_URL" || true
            displayName: 'Check Sonar URL reachability (optional)'
            env:
              SONAR_HOST_URL: $(SONAR_HOST_URL)

          - script: |
              docker run --rm \
                -e SONAR_TOKEN="$SONAR_TOKEN" \
                -e SONAR_HOST_URL="$SONAR_HOST_URL" \
                -v "$(System.DefaultWorkingDirectory)":/usr/src \
                -w /usr/src sonarsource/sonar-scanner-cli:5.0.1 \
                -Dsonar.host.url="$SONAR_HOST_URL" \
                -Dsonar.projectKey=2025-g06-frontend \
                -Dsonar.sources=src \
                -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
            displayName: 'Run SonarQube analysis (containerized)'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
              SONAR_HOST_URL: $(SONAR_HOST_URL)
            continueOnError: true

  # --- DEPLOY (no Docker, site forzado) -------------------------------------
  - stage: Deploy
    displayName: 'Deploy to Firebase'
    dependsOn:
      - Build
      - Sonarqube
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Firebase Hosting'
        environment: 'Firebase'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self   # Necesario para tener firebase.json y .firebaserc

                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'dist'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifacts'

                - script: |
                    set -euxo pipefail
                    rm -rf "$(DIST_PATH)"
                    mkdir -p "$(DIST_PATH)"
                    cp -r "$(System.ArtifactsDirectory)/dist/." "$(DIST_PATH)/"

                    echo "==> Comprobando contenido de $(DIST_PATH)"
                    ls -la "$(DIST_PATH)"
                    test -f "$(DIST_PATH)/index.html"
                    test -s "$(DIST_PATH)/index.html"  # no vacío
                  displayName: 'Place artifact under hosting.public'

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'
                  displayName: 'Use Node 20.x'

                - script: |
                    set -eux
                    npm i -g firebase-tools
                    firebase --version
                  displayName: 'Install firebase-tools'

                - script: |
                    echo "==> Sites del proyecto (debug)"
                    firebase hosting:sites:list --project esimedia-frontend-g06 --token "${FIREBASE_TOKEN}"
                  displayName: 'List Firebase sites'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)
                  continueOnError: true

                - script: |
                    echo "==> Últimas versiones (antes de deploy)"
                    firebase hosting:versions:list --site esimedia-frontend-g06 --project esimedia-frontend-g06 --limit 5 --token "${FIREBASE_TOKEN}"
                  displayName: 'List Firebase versions (before deploy)'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)
                  continueOnError: true

                - script: |
                    set -eux
                    echo "==> DEPLOY a LIVE forzando siteId"
                    firebase deploy \
                      --only hosting \
                      --project esimedia-frontend-g06 \
                      --site esimedia-frontend-g06 \
                      --config ./firebase.json \
                      --non-interactive \
                      --token "${FIREBASE_TOKEN}" \
                      --debug
                  displayName: 'Deploy to Firebase Hosting'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)

                - script: |
                    echo "==> Últimas versiones (después de deploy)"
                    firebase hosting:versions:list --site esimedia-frontend-g06 --project esimedia-frontend-g06 --limit 5 --token "${FIREBASE_TOKEN}"
                  displayName: 'List Firebase versions (after deploy)'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)
                  continueOnError: true

                - script: |
                    echo "✓ Deploy completado exitosamente"
                  displayName: 'Deploy confirmation'
