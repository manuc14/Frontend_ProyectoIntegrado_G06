trigger:
  branches:
    include:
      - Mario_dev
  paths:
    exclude:
      - README.md
      - .gitignore

variables:
  - name: DIST_PATH
    value: 'dist/frontend_g06/browser'     # Debe coincidir con hosting.public en firebase.json
  - group: firebase-secrets                 # Contiene: FIREBASE_TOKEN
  # (Sonar ya NO usa variables de grupo: va por Service Connection)

stages:
  # --- PREPARATION -----------------------------------------------------------
  - stage: Preparation
    displayName: 'Preparation and Validation'
    jobs:
      - job: PreparationJob
        displayName: 'Validate Environment'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "Repo: $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              docker version
              docker info | sed -n '1,25p'
            displayName: 'Show agent & Docker info'

          - script: |
              test -f .firebaserc   || { echo ".firebaserc not found"; exit 1; }
              test -f firebase.json || { echo "firebase.json not found"; exit 1; }
              echo "✓ Firebase config present"
            displayName: 'Validate Firebase config files'

  # --- BUILD (inside Docker) -------------------------------------------------
  - stage: Build
    displayName: 'Build Angular (Docker)'
    dependsOn: Preparation
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: 'Dockerized Build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              docker run --rm \
                -v "$(System.DefaultWorkingDirectory)":/app \
                -w /app node:20 \
                bash -lc "node -v && npm -v && npm ci && npm run build"
            displayName: 'npm ci + build inside Docker (node:20)'

          - script: |
              echo "Contenido de $(DIST_PATH):"
              ls -la "$(System.DefaultWorkingDirectory)/$(DIST_PATH)" || \
                { echo "Revisa DIST_PATH y el output del build"; exit 1; }
            displayName: 'Inspect dist output'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)/$(DIST_PATH)'
              artifactName: 'dist'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  # --- SONAR (self-hosted + extensión oficial) ------------------------------
  - stage: Sonarqube
    displayName: 'SonarQube (UCLM/VPN)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SonarJob
        displayName: 'Analyze in SonarQube via service connection'
        pool:
          name: 'UCLM-VPN'     # <--- tu pool self-hosted con la VPN/campus
        steps:
          - checkout: self

          # (Opcional) Reachability check desde el agente con VPN
          - script: |
              echo "Agent: $(Agent.Name)"
              echo "Probing SonarQube en http://seralu4.esi.uclm.es:1521 ..."
              curl -sS --max-time 5 http://seralu4.esi.uclm.es:1521/api/server/version || true
            displayName: 'Check Sonar reachability'

          # Requiere extensión "SonarQube" instalada y Service Connection creada
          - task: SonarQubePrepare@5
            displayName: 'Prepare SonarQube analysis'
            inputs:
              SonarQube: 'sonarqube-esi'       # <--- NOMBRE EXACTO de tu Service Connection
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: '2025-g06-frontend'
              cliProjectName: '2025-g06-frontend'
              cliSources: 'src'
              extraProperties: |
                sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
                sonar.sourceEncoding=UTF-8

          - task: SonarQubeAnalyze@5
            displayName: 'Run SonarQube analysis'

          - task: SonarQubePublish@5
            displayName: 'Publish Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

  # --- DEPLOY (Hosted, NodeTool + Firebase CLI) ------------------------------
  - stage: Deploy
    displayName: 'Deploy to Firebase'
    dependsOn:
      - Build
      - Sonarqube
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Firebase Hosting'
        environment: 'Firebase'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self   # Necesario para tener firebase.json y .firebaserc

                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'dist'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifacts'

                - script: |
                    set -euxo pipefail
                    rm -rf "$(DIST_PATH)"
                    mkdir -p "$(DIST_PATH)"
                    cp -r "$(System.ArtifactsDirectory)/dist/." "$(DIST_PATH)/"

                    echo "==> Comprobando contenido de $(DIST_PATH)"
                    ls -la "$(DIST_PATH)"
                    test -f "$(DIST_PATH)/index.html"
                    test -s "$(DIST_PATH)/index.html"  # no vacío
                  displayName: 'Place artifact under hosting.public'

                - task: NodeTool@0
                  inputs:
                    versionSpec: '20.x'
                  displayName: 'Use Node 20.x'

                - script: |
                    set -eux
                    npm i -g firebase-tools
                    firebase --version
                  displayName: 'Install firebase-tools'

                - script: |
                    set -eux
                    firebase deploy \
                      --only hosting \
                      --project esimedia-frontend-g06 \
                      --non-interactive \
                      --token "${FIREBASE_TOKEN}"
                  displayName: 'Deploy to Firebase Hosting'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)
