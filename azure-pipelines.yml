trigger:
  branches:
    include:
      - Mario_dev
  paths:
    exclude:
      - README.md
      - .gitignore

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: firebase-secrets
  - group: sonarqube-secrets

stages:
  - stage: Preparation
    displayName: 'Preparation and Validation'
    jobs:
      - job: PreparationJob
        displayName: 'Validate Environment'
        container:
          image: node:20-alpine
          options: --cpus 1 --memory 2048m
        steps:
          - checkout: self

          - script: |
              echo "=== Node.js Version ==="
              node --version
              echo "=== NPM Version ==="
              npm --version
              echo "=== Docker Information ==="
              docker --version
              echo "=== Pipeline Variables ==="
              echo "Branch: $(Build.SourceBranch)"
              echo "Repository: $(Build.Repository.Name)"
              echo "Build ID: $(Build.BuildId)"
            displayName: 'Display Environment Information'

          - script: npm ci --dry-run
            displayName: 'Validate npm dependencies'

          - script: |
              if [ ! -f ".firebaserc" ]; then
                echo "Error: .firebaserc not found"
                exit 1
              fi
              if [ ! -f "firebase.json" ]; then
                echo "Error: firebase.json not found"
                exit 1
              fi
              echo "✓ Firebase configuration files validated"
            displayName: 'Validate Firebase configuration'

  - stage: Build
    displayName: 'Build Angular Application'
    dependsOn: Preparation
    condition: succeeded()
    jobs:
      - job: BuildJob
        displayName: 'Build and Test'
        container:
          image: node:20-alpine
          options: --cpus 2 --memory 4096m
        steps:
          - checkout: self

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build Angular application'

          - script: npm run test -- --watch=false --code-coverage
            displayName: 'Run unit tests'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: 'dist/frontend_g06/browser'
              artifactName: 'dist'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  - stage: Sonarqube
    displayName: 'SonarQube Code Analysis'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: SonarqubeJob
        displayName: 'SonarQube Analysis'
        container:
          image: node:20-alpine
          options: --cpus 2 --memory 4096m
        steps:
          - checkout: self

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build Angular application'

          - script: |
              npm install -g sonar-scanner
              sonar-scanner \
                -Dsonar.token=$(SONAR_TOKEN) \
                -Dsonar.host.url=$(SONAR_HOST_URL) \
                -Dsonar.projectKey=2025-g06-frontend \
                -Dsonar.projectName=2025-g06-frontend \
                -Dsonar.sources=src \
                -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/*.spec.ts"
            displayName: 'Run SonarQube analysis'
            continueOnError: true

  - stage: Deploy
    displayName: 'Deploy to Firebase'
    dependsOn: 
      - Build
      - Sonarqube
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Firebase Hosting'
        environment: 'Firebase'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: UseNode@1
                  inputs:
                    version: '20.x'
                  displayName: 'Setup Node.js'

                - script: npm install -g firebase-tools
                  displayName: 'Install Firebase CLI'

                - task: DownloadBuildArtifacts@1
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'dist'
                    downloadPath: '$(System.ArtifactsDirectory)'
                  displayName: 'Download build artifacts'

                - script: |
                    ls -la $(System.ArtifactsDirectory)
                    firebase deploy --only hosting --token $(FIREBASE_TOKEN) --project esimedia-frontend-g06 --non-interactive --public $(System.ArtifactsDirectory)/dist
                  displayName: 'Deploy to Firebase Hosting'
                  env:
                    FIREBASE_TOKEN: $(FIREBASE_TOKEN)