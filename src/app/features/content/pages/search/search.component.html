<app-header></app-header>

<div class="search-page">
  <div class="search-container">
    <!-- Título y barra de búsqueda -->
    <div class="search-header">
      <h1 class="search-title">Buscar</h1>
      
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Buscar en ESIMedia: títulos, etiquetas o creadores"
          [(ngModel)]="searchTerm"
          (input)="onSearch()"
        />
      </div>
    </div>

    <!-- Resultados -->
    <div class="results-section" *ngIf="hasResults">
      <h2 class="section-title">{{ searchTerm ? 'Resultados de búsqueda' : 'Todo el contenido' }}</h2>
      
      <div class="popular-grid">
        <button
          class="popular-card"
          *ngFor="let item of displayedResults"
          (click)="navigateToContent(item)"
        >
          <div class="card-thumbnail">
            <img [src]="item.thumbnail" [alt]="item.title" />
            <div class="card-type-badge">
              {{ item.tipo === 'VIDEO' ? 'Vídeo' : 'Audio' }}
            </div>
          </div>
          <div class="card-content">
            <h3 class="card-title">{{ item.title }}</h3>
            <div class="card-creator">
              <div class="creator-avatar">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
              <span class="creator-name">{{ item.creator }}</span>
            </div>
            <div class="card-tags" *ngIf="item.tags.length > 0">
              <span class="tag" *ngFor="let tag of item.tags.slice(0, 2)">{{ tag }}</span>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- Estado de carga -->
    <div class="loading-state" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Cargando contenido...</p>
    </div>

    <!-- Sin resultados -->
    <div class="empty-state" *ngIf="!isLoading && searchTerm && !hasResults">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <h3>No se encontraron resultados</h3>
      <p>Intenta con otros términos de búsqueda</p>
    </div>
  </div>
</div>

<app-footer></app-footer>
