<!-- Header -->
<app-header></app-header>

<div class="catalog" (click)="cerrarDropdowns()" (keydown)="$event.key === 'Escape' && cerrarDropdowns()">
  
  <div class="catalog__main-container">
    <!-- Filtros de contenido y búsqueda -->
    <section class="catalog__filters-section">
      <div class="catalog__filters-container">
        <!-- Pills de tipo de contenido -->
        <div class="catalog__content-types">
          <app-filter-pill
            label="Vídeo"
            icon="assets/icons/video.svg"
            [isActive]="seccionActiva === 'VIDEO'"
            [isPrimary]="true"
            (onClick)="cambiarSeccion('VIDEO')">
          </app-filter-pill>
          
          <app-filter-pill
            label="Audio"
            icon="assets/icons/audio.svg"
            [isActive]="seccionActiva === 'AUDIO'"
            [isPrimary]="true"
            (onClick)="cambiarSeccion('AUDIO')">
          </app-filter-pill>
        </div>

        <!-- Filtros -->
        <div class="catalog__filters">
          <!-- Filtro Premium -->
          <app-filter-pill
            label="Premium"
            icon="assets/icons/star.svg"
            [isActive]="filtroPremium"
            (onClick)="toggleFiltroPremium()">
          </app-filter-pill>

          <!-- Filtro Edad -->
          <div class="catalog__filter-dropdown" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
            <app-filter-pill
              [label]="textoBotonEdad"
              icon="assets/icons/age.svg"
              [isActive]="filtroEdad !== null"
              (onClick)="dropdownEdadAbierto = !dropdownEdadAbierto; dropdownCalidadAbierto = false">
            </app-filter-pill>
            
            <div class="catalog__dropdown" *ngIf="dropdownEdadAbierto">
              <button
                *ngFor="let edad of opcionesEdad"
                class="catalog__dropdown-item"
                [class.active]="filtroEdad === edad"
                (click)="seleccionarEdad(edad)">
                {{ edad }}+
              </button>
            </div>
          </div>

          <!-- Filtro Calidad (solo para videos) -->
          <div class="catalog__filter-dropdown" *ngIf="seccionActiva === 'VIDEO'" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
            <app-filter-pill
              [label]="textoBotonCalidad"
              icon="assets/icons/quality.svg"
              [isActive]="filtroCalidad.length > 0"
              (onClick)="dropdownCalidadAbierto = !dropdownCalidadAbierto; dropdownEdadAbierto = false">
            </app-filter-pill>
            
            <div class="catalog__dropdown" *ngIf="dropdownCalidadAbierto">
              <button
                *ngFor="let calidad of opcionesCalidad"
                class="catalog__dropdown-item"
                [class.active]="filtroCalidad.includes(calidad)"
                (click)="toggleCalidad(calidad)">
                {{ calidad }}
              </button>
            </div>
          </div>

          <!-- Filtro Especialidad (sin funcionalidad) -->
          <app-filter-pill
            label="Especialidad"
            icon="assets/icons/specialty.svg"
            [isActive]="false">
          </app-filter-pill>

          <!-- Filtro Etiquetas (sin funcionalidad) -->
          <app-filter-pill
            label="Etiquetas"
            icon="assets/icons/tags.svg"
            [isActive]="false">
          </app-filter-pill>

          <!-- Botón de búsqueda -->
          <button class="catalog__search-btn" (click)="irABusqueda()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" 
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Contenido destacado -->
    <section class="catalog__hero" *ngIf="contenidoDestacado">
      <div class="catalog__hero-card">
        <img [src]="contenidoDestacado.miniaturaUrl" [alt]="contenidoDestacado.titulo" class="catalog__hero-img">
        <div class="catalog__hero-overlay">
          <div class="catalog__hero-content">
            <h2 class="catalog__hero-title">Destacado de hoy: {{ contenidoDestacado.titulo }}</h2>
            <div class="catalog__hero-meta">
              <span *ngIf="contenidoDestacado.tipo === 'VIDEO' && contenidoDestacado.resolucion">{{ contenidoDestacado.resolucion }}</span>
              <span *ngIf="contenidoDestacado.tipo === 'VIDEO' && contenidoDestacado.resolucion">•</span>
              <span>{{ contenidoDestacado.duracion }} min</span>
              <span *ngIf="contenidoDestacado.categoria">•</span>
              <span *ngIf="contenidoDestacado.categoria">{{ contenidoDestacado.categoria }}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Listas de contenido -->
    <main class="catalog__content">
    <!-- Tendencias (Carrusel Automático) -->
    <section class="catalog__section" *ngIf="contenidoTendencias.length > 0">
      <h2 class="catalog__section-title">Tendencias</h2>
      <div 
        #carouselContainer
        class="catalog__carousel"
        (mouseenter)="pausarCarrusel()"
        (mouseleave)="reanudarCarrusel()"
        (touchstart)="pausarCarrusel()"
        (touchend)="reanudarCarrusel()">
        <app-content-card
          *ngFor="let contenido of contenidoTendencias"
          [contenido]="contenido">
        </app-content-card>
      </div>
    </section>

    <!-- Nuevos lanzamientos -->
    <section class="catalog__section" *ngIf="contenidoNuevosLanzamientos.length > 0">
      <h2 class="catalog__section-title">Nuevos lanzamientos</h2>
      <div class="catalog__grid">
        <app-content-card
          *ngFor="let contenido of contenidoNuevosLanzamientos"
          [contenido]="contenido">
        </app-content-card>
      </div>
    </section>

    <!-- Recomendado -->
    <section class="catalog__section" *ngIf="contenidoRecomendado.length > 0">
      <h2 class="catalog__section-title">Recomendado para ti</h2>
      <div class="catalog__grid">
        <app-content-card
          *ngFor="let contenido of contenidoRecomendado"
          [contenido]="contenido">
        </app-content-card>
      </div>
    </section>

    <!-- Mensaje si no hay contenido -->
    <div class="catalog__empty" *ngIf="contenidoFiltrado.length === 0">
      <p>No se encontró contenido con los filtros seleccionados.</p>
    </div>
  </main>
  </div>
</div>

<!-- Footer -->
<app-footer></app-footer>
