<div class="preview-page">
  <!-- Imagen de fondo (miniatura del video) -->
  <div class="background-image-container">
    <img 
      [src]="contenido?.miniaturaUrl || contenido?.foto || 'https://images.unsplash.com/photo-1579033461380-adb47c3eb938?w=1920&h=1080&fit=crop'" 
      [alt]="contenido?.titulo || 'Vista previa del contenido'" 
      class="background-image"
      (error)="onImageError($event)" />
  </div>

  <!-- Contenido superpuesto -->
  <div class="preview-content">
    <!-- Botón Volver (arriba a la izquierda) -->
    <app-back-button 
      class="back-button-position"
      [navigateTo]="'/catalog'">
    </app-back-button>

    <!-- Tarjetas principales (abajo) -->
    <div class="cards-container">
      <!-- Tarjeta de información del contenido (izquierda) -->
      <div class="info-card glass-card" *ngIf="contenido">
        <div class="card-content">
          <!-- Título y acciones -->
          <div class="title-row">
            <h1 class="content-title">{{ contenido.titulo }}</h1>
            
            <div class="quick-actions">
              <app-action-button
                icon="heart"
                variant="icon"
                size="medium"
                (onClick)="addToFavorites()">
              </app-action-button>
              
              <app-action-button
                icon="plus"
                variant="icon"
                size="medium"
                (onClick)="addToList()">
              </app-action-button>
            </div>
          </div>

          <!-- Metadatos: Creador, Premium, Calidad, Edad -->
          <div class="metadata-row">
            <div class="metadata-pill creator-pill" *ngIf="contenido.creador">
              <img [src]="contenido.creador.avatar" 
                   [alt]="contenido.creador.nombre" 
                   class="creator-avatar" 
                   (error)="onImageError($event)" />
              <span>{{ contenido.creador.nombre }}</span>
            </div>

            <div class="metadata-pill" *ngIf="contenido.contenidoVip">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
              </svg>
              <span>Premium</span>
            </div>

            <div class="metadata-pill" *ngIf="contenido.resolucion">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8"/>
                <path d="M12 17v4"/>
              </svg>
              <span>{{ contenido.resolucion }}</span>
            </div>

            <div class="metadata-pill age-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2" stroke="white" stroke-width="2" fill="none"/>
              </svg>
              <span>{{ getAgeRestrictionIcon() }}</span>
            </div>
          </div>

          <!-- Botón Reproducir -->
          <div class="play-button-container">
            <app-action-button
              label="Reproducir"
              icon="play"
              variant="primary"
              size="medium"
              (onClick)="playContent()">
            </app-action-button>
          </div>

          <!-- Descripción -->
          <div class="description-section">
            <p class="description-text">{{ contenido.descripcion }}</p>
            
            <!-- Tags -->
            <div class="tags-container">
              <app-filter-pill 
                *ngFor="let tag of contenido.tags"
                [label]="tag"
                [isActive]="false"
                class="content-tag">
              </app-filter-pill>
            </div>
          </div>
        </div>
      </div>

      <!-- Tarjeta de valoración (derecha) -->
      <div class="rating-card glass-card" *ngIf="contenido">
        <div class="card-content">
          <!-- Título y valoración promedio -->
          <div class="rating-header">
            <h2 class="rating-title">Valora este vídeo</h2>
            
            <div class="average-rating">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFD700">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
              </svg>
              <span class="rating-value">4,2</span>
            </div>
          </div>

          <!-- Sección de estrellas -->
          <div class="user-rating-section">
            <p class="rating-instructions">Elige tu valoración (1 a 5 estrellas)</p>
            
            <div class="stars-container">
              <button 
                *ngFor="let star of [1, 2, 3, 4, 5]"
                class="star-button"
                [class.filled]="isStarFilled(star)"
                (click)="setRating(star)"
                (mouseenter)="setHoverRating(star)"
                (mouseleave)="clearHoverRating()">
                <svg width="18" height="18" viewBox="0 0 24 24" 
                     [attr.fill]="isStarFilled(star) ? '#FFD700' : 'none'"
                     stroke="currentColor"
                     stroke-width="2">
                  <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
