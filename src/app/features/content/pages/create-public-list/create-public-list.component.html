<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <form [formGroup]="listForm" (ngSubmit)="onSubmit()">
        <!-- Header -->
        <div class="horizontal-border">
          <div class="container">
            <div class="text">Crear lista pública</div>
          </div>
          <button class="border" type="button" (click)="goBack()" [@buttonHover] [@buttonPress]>
            <div class="iconify-icon">
              <img class="svg" src="assets/admin/salir.svg" alt="icono salir" height="18" width="19"/>
            </div>
            <div class="text2">Cerrar</div>
          </button>
        </div>
        <!-- Main Content -->
        <div class="container2">
          <!-- Error Container -->
          <app-error-container [error]="currentFormState?.error"></app-error-container>
          <!-- Nombre de la lista -->
          <app-form-input
            label="Nombre de la lista"
            formControlName="nombre"
            placeholder="Ej. Favoritos de la semana, Videos destacados, Podcast recomendados…"
            [required]="true"
            [errors]="listForm.get('nombre')?.errors ?? null"
            [touched]="listForm.get('nombre')?.touched ?? false">
          </app-form-input>
          <!-- Descripción -->
          <app-textarea-field
            label="Descripción (opcional)"
            formControlName="descripcion"
            placeholder="Añade una breve descripción de esta lista pública…">
          </app-textarea-field>
          <!-- TOGGLE DE VISIBILIDAD -->
          <div class="visibility-toggle-section">
            <label for="visibility-toggle-btn" class="visibility-label">
              <span class="label-text">Visibilidad de la lista</span>
              <span class="label-hint">Controla si esta lista será visible para otros usuarios</span>
            </label>
            <div class="visibility-switch">
              <button
                type="button"
                id="visibility-toggle-btn"
                class="visibility-btn"
                [class.active]="isVisible"
                (click)="onVisibilityChange(!isVisible)"
                [attr.aria-pressed]="isVisible"
                [@buttonHover]
                [@buttonPress]>
                <svg *ngIf="isVisible" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z"/>
                </svg>
                <svg *ngIf="!isVisible" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z"/>
                </svg>
                <span class="visibility-text">{{ isVisible ? 'Visible' : 'Oculta' }}</span>
              </button>
            </div>
          </div>
          <app-content-selector
            [showTypeToggle]="true"
            [showSelectedCount]="false"
            (typeChange)="selectedContentType = $event"
            (selectedChange)="addedContent = $event">
          </app-content-selector>
        </div>
        <!-- Footer Actions -->
        <div class="footer-actions">
          <button
            type="button"
            class="btn-cancel"
            (click)="goBack()"
            [@buttonHover]
            [@buttonPress]>
            Cancelar
          </button>
          <button
            type="submit"
            class="btn-save"
            [disabled]="currentFormState?.isSubmitting || addedContent.length === 0"
            [@buttonHover]
            [@buttonPress]>
            <svg *ngIf="!currentFormState?.isSubmitting" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3M19,19H5V5H16.17L19,7.83V19M12,12C10.34,12 9,13.34 9,15C9,16.66 10.34,18 12,18C13.66,18 15,16.66 15,15C15,13.34 13.66,12 12,12M6,6H15V10H6V6Z"/>
            </svg>
            <span>{{ currentFormState?.isSubmitting ? 'Creando...' : 'Crear lista' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
