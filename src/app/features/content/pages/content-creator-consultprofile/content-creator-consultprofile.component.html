<app-header></app-header>

<main class="background">
  <div class="container">
    
    <!-- Título de la página -->
    <div class="container2">
      <div class="container3">
        <div class="text">Mi Perfil de Creador</div>
      </div>
    </div>

    <!-- Mensaje de éxito -->
    <div class="success-message" *ngIf="showSuccessMessage">
      <div class="success-content">
        <img src="assets/icons/check-circle.svg" alt="Éxito" class="success-icon" />
        {{ successMessage }}
      </div>
    </div>

    <!-- Estado de carga del FormBaseService -->
    <div *ngIf="formState$ | async as formState" class="form-status">
      <!-- Indicador de carga -->
      <div *ngIf="formState.isLoading" class="loading-indicator">
        Cargando perfil...
      </div>
      
      <!-- Mensaje de error general -->
      <div *ngIf="formState.error" class="error-message global-error">
        {{ formState.error }}
      </div>
    </div>

    <!-- Contenedor principal con fondo blanco -->
    <div class="background-border-shadow">
      
      <!-- Columna izquierda - Selector de Avatar -->
      <div class="container4" [class.avatar-disabled]="!isEditMode">
        <app-avatar-selector
          [availableAvatars]="availableAvatars"
          [selectedAvatar]="selectedAvatar"
          [nombre]="profileForm.get('firstName')?.value || 'Usuario'"
          (avatarSelected)="onAvatarSelected($event)">
        </app-avatar-selector>
      </div>

      <!-- Columna derecha - Detalles del creador -->
      <div class="container9">
        <div class="margin">
          <div class="container5">
            <div class="text4">Información personal</div>
            <!-- Botón de edición -->
            <button 
              type="button"
              class="edit-button-top-right"
              [class.active]="isEditMode"
              (click)="toggleEditMode()"
              [title]="isEditMode ? 'Salir del modo edición' : 'Editar perfil'">
              <img class="edit-icon" src="assets/icons/edit-pencil.svg" alt="Editar" />
            </button>
          </div>
        </div>
        
        <form [formGroup]="profileForm">
          <!-- Primera fila: Nombre y Apellidos -->
          <div class="form-row">
            <div class="field-container">
              <app-form-input
                label="Nombre"
                type="text"
                [maxlength]="maxNombre"
                placeholder="Ingresa tu nombre"
                [required]="true"
                formControlName="firstName"
                [errors]="firstNameControl?.errors ?? null"
                [touched]="firstNameControl?.touched || false"
                [disabled]="!isEditMode">
              </app-form-input>
            </div>

            <div class="field-container">
              <app-form-input
                label="Apellidos"
                type="text"
                [maxlength]="maxApellidos"
                placeholder="Ingresa tus apellidos"
                [required]="true"
                formControlName="lastName"
                [errors]="lastNameControl?.errors ?? null"
                [touched]="lastNameControl?.touched || false"
                [disabled]="!isEditMode">
              </app-form-input>
            </div>
          </div>

          <!-- Segunda fila: Alias y Email -->
          <div class="form-row">
            <div class="field-container">
              <app-form-input
                label="Alias"
                type="text"
                [maxlength]="maxAlias"
                placeholder="Tu nombre artístico o creativo"
                [required]="false"
                formControlName="alias"
                [errors]="aliasControl?.errors ?? null"
                [touched]="aliasControl?.touched || false"
                [disabled]="!isEditMode">
              </app-form-input>
              <!-- Mensaje de error específico para alias con formato estándar -->
              <div class="error-message alias-error" *ngIf="aliasErrorMessage">
                {{ aliasErrorMessage }}
              </div>
            </div>

            <div class="field-container">
              <app-form-input
                label="Email"
                type="email"
                [maxlength]="maxEmail"
                placeholder="email@ejemplo.com"
                [required]="false"
                formControlName="email"
                [errors]="profileForm.get('email')?.errors ?? null"
                [touched]="profileForm.get('email')?.touched || false"
                [disabled]="true">
              </app-form-input>
            </div>
          </div>

          <!-- Tercera fila: Especialidad y Tipo de Contenido -->
          <div class="form-row">
            <div class="field-container">
              <app-select-field
                label="Especialidad"
                formControlName="specialty"
                placeholder="Selecciona tu especialidad"
                [disabled]="!isEditMode"
                class="specialty-select">
                <option value="">Selecciona tu especialidad</option>
                <option *ngFor="let option of specialtyOptions" [value]="option.value">{{ option.label }}</option>
              </app-select-field>
            </div>

            <div class="field-container">
              <app-form-input
                label="Tipo de Contenido"
                type="text"
                placeholder="Tu tipo de contenido principal"
                [required]="false"
                formControlName="contentType"
                [disabled]="true">
              </app-form-input>
            </div>
          </div>

          <!-- Cuarta fila: Descripción (campo amplio) -->
          <div class="form-row">
            <div class="field-container full-width">
              <app-textarea-field
                label="Descripción"
                placeholder="Describe tu trabajo como creador de contenido"
                formControlName="description"
                [maxlength]="maxDescripcion.toString()"
                [disabled]="!isEditMode">
              </app-textarea-field>
            </div>
          </div>
        </form>
      </div>

      <!-- Botones de acción - Solo visible en modo edición -->
      <div class="margin2" *ngIf="isEditMode">
        <div class="container17">
          <button 
            type="button" 
            class="border"
            [disabled]="!hasUnsavedChanges"
            (click)="onCancelChanges()">
            <div class="text17">Cancelar</div>
          </button>
          
          <button 
            type="button" 
            class="background-border14"
            [disabled]="!hasUnsavedChanges || (formState$ | async)?.isSubmitting"
            (click)="onSaveChanges()">
            <div class="text18">
              <ng-container *ngIf="(formState$ | async)?.isSubmitting; else normalSave">
                Guardando...
              </ng-container>
              <ng-template #normalSave>
                Guardar cambios
              </ng-template>
            </div>
          </button>
        </div>
      </div>

    </div>
  </div>
</main>
