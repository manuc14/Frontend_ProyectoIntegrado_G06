<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <form (ngSubmit)="onSubmit()">
        <!-- Header -->
        <div class="horizontal-border">
          <div class="container">
            <div class="text">Añadir contenido a "{{ listName }}"</div>
            <div class="hint">Tipo de lista: {{ listType === 'VIDEO' ? 'Vídeos' : 'Audios' }}</div>
          </div>
          <button class="border" type="button" (click)="goBack()" [@buttonHover] [@buttonPress]>
            <div class="iconify-icon">
              <img class="svg" src="assets/admin/salir.svg" alt="icono salir" height="18" width="19"/>
            </div>
            <div class="text2">Cerrar</div>
          </button>
        </div>
        <!-- Main Content -->
        <div class="container2">
          <!-- Error Message -->
          <div *ngIf="error" class="error-message">
            {{ error }}
          </div>
          <app-content-selector
            [showTypeToggle]="false"
            [showSelectedCount]="true"
            [initialType]="listType"
            (selectedChange)="selectedContent = $event">
          </app-content-selector>
        </div>
        <!-- Footer Actions -->
        <div class="footer-actions">
          <button
            type="button"
            class="btn-cancel"
            (click)="goBack()"
            [@buttonHover]
            [@buttonPress]>
            Cancelar
          </button>
          <button
            type="submit"
            class="btn-save"
            [disabled]="isSubmitting || selectedContent.length === 0"
            [@buttonHover]
            [@buttonPress]>
            <svg *ngIf="!isSubmitting" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
            </svg>
            <span>{{ isSubmitting ? 'Añadiendo...' : 'Añadir contenido' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
