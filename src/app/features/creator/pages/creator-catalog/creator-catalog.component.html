<!-- Header del creador -->
<app-content-creator-header></app-content-creator-header>

<div class="creator-layout">
  <!-- Sidebar Navigation -->
  <aside class="creator-layout__sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="creator-layout__sidebar-content">
      <!-- Navigation Items -->
      <nav class="creator-layout__nav">
        <a routerLink="/content-creator" routerLinkActive="active" class="creator-layout__nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Inicio</span>
        </a>

        <a routerLink="/creator/profile" routerLinkActive="active" class="creator-layout__nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Mi perfil</span>
        </a>

        <a routerLink="/creator/catalog" routerLinkActive="active" class="creator-layout__nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 5H7C5.89543 5 5 5.89543 5 7V19C5 20.1046 5.89543 21 7 21H17C18.1046 21 19 20.1046 19 19V7C19 5.89543 18.1046 5 17 5H15M9 5C9 6.10457 9.89543 7 11 7H13C14.1046 7 15 6.10457 15 5M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5M12 12H15M12 16H15M9 12H9.01M9 16H9.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Mis listas</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="creator-layout__main">
    <!-- Reusamos el componente de catálogo con vista de creador -->
    <app-catalog [isCreatorView]="true"></app-catalog>
  </main>
</div>

<!-- Footer -->
<app-footer></app-footer>
