<div class="private-lists">
  <!-- Título y botón de crear -->
  <div class="private-lists__header">
    <h1 class="private-lists__title">Mis Listas Privadas</h1>
    <button class="private-lists__create-btn" (click)="crearLista()">
      <span class="private-lists__create-icon">+</span>
      Crear Lista
    </button>
  </div>

  <!-- Sección de pestañas y filtros -->
  <div class="private-lists__controls">
    <!-- Pestañas -->
    <div class="private-lists__tabs">
      <button
        class="private-lists__tab"
        [class.private-lists__tab--active]="seccionActiva === 'VIDEO'"
        (click)="cambiarSeccion('VIDEO')"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/>
        </svg>
        Videos
      </button>
      <button
        class="private-lists__tab"
        [class.private-lists__tab--active]="seccionActiva === 'AUDIO'"
        (click)="cambiarSeccion('AUDIO')"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/>
        </svg>
        Audios
      </button>
    </div>

    <!-- Filtros -->
    <div class="private-lists__filters">
      <app-filter-pill
        [label]="filtroPremium ? 'Premium' : 'Premium'"
        [iconType]="'premium'"
        [isActive]="filtroPremium"
        (onClick)="toggleFiltroPremium()"
      ></app-filter-pill>

      <div class="filter-dropdown">
        <app-filter-pill
          [label]="filtroEdad ? filtroEdad + '+' : 'Edad'"
          [iconType]="'age'"
          [isActive]="filtroEdad !== null"
          (onClick)="dropdownEdadAbierto = !dropdownEdadAbierto"
        ></app-filter-pill>
        <div class="filter-dropdown__menu" *ngIf="dropdownEdadAbierto">
          <button (click)="cambiarFiltroEdad(null)">Todas</button>
          <button *ngFor="let edad of opcionesEdad" (click)="cambiarFiltroEdad(edad)">
            {{ edad }}+
          </button>
        </div>
      </div>

      <div class="filter-dropdown" *ngIf="seccionActiva === 'VIDEO'">
        <app-filter-pill
          [label]="filtroCalidad || 'Calidad'"
          [iconType]="'quality'"
          [isActive]="filtroCalidad !== null"
          (onClick)="dropdownCalidadAbierto = !dropdownCalidadAbierto"
        ></app-filter-pill>
        <div class="filter-dropdown__menu" *ngIf="dropdownCalidadAbierto">
          <button (click)="cambiarFiltroCalidad(null)">Todas</button>
          <button *ngFor="let calidad of opcionesCalidad" (click)="cambiarFiltroCalidad(calidad)">
            {{ calidad }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje de error o listas vacías -->
  <div class="private-lists__error" *ngIf="errorCarga">
    <p>{{ errorCarga }}</p>
  </div>

  <!-- Listas privadas -->
  <div class="private-lists__content" *ngIf="!errorCarga && listasPrivadas.length > 0">
    <section class="private-lists__section" *ngFor="let lista of listasPrivadas">
      <div class="private-lists__section-header">
        <h2 class="private-lists__section-title">{{ lista.nombre }}</h2>
        <p class="private-lists__section-description" *ngIf="lista.descripcion">
          {{ lista.descripcion }}
        </p>
        <app-list-action-buttons
          [section]="lista.id"
          (editList)="onEditarLista($event)"
          (deleteList)="onEliminarLista($event)"
          *ngIf="!isFavoritosList(lista.id)"
        ></app-list-action-buttons>
      </div>

      <div class="private-lists__section-content">
        <app-content-card
          *ngFor="let item of lista.items"
          [contenido]="item"
          [navigationOrigin]="'private-lists'"
        ></app-content-card>
      </div>
    </section>
  </div>
</div>
