<div class="page-container">
  <app-header />

  <main class="background" [@fadeIn]>
    <section class="container3">
      <div class="container4">
        <div class="background-border" [@shakeError]="shakeForm ? 'shake' : ''">
          <div class="container5"><div class="text8">Introduce el código de verificación</div></div>
          <div class="container5"><div class="text9">Escribe el código de 6 dígitos que enviamos a tu email</div></div>

          <!-- Mensajes de error y éxito -->
          <div
            class="field-error"
            *ngIf="errorMessage && hasError"
          >
            {{ errorMessage }}
          </div>
          <div
            class="field-success"
            *ngIf="successMessage && !hasError"
          >
            {{ successMessage }}
          </div>

          <div class="container6">
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(0, $event)" (keydown)="onKeyDown(0, $event)" (paste)="onPaste(0, $event)"
                   [@inputFocus]="getInputFocusState(0)" (focus)="onInputFocus(0)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(1, $event)" (keydown)="onKeyDown(1, $event)" (paste)="onPaste(1, $event)"
                   [@inputFocus]="getInputFocusState(1)" (focus)="onInputFocus(1)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(2, $event)" (keydown)="onKeyDown(2, $event)" (paste)="onPaste(2, $event)"
                   [@inputFocus]="getInputFocusState(2)" (focus)="onInputFocus(2)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(3, $event)" (keydown)="onKeyDown(3, $event)" (paste)="onPaste(3, $event)"
                   [@inputFocus]="getInputFocusState(3)" (focus)="onInputFocus(3)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(4, $event)" (keydown)="onKeyDown(4, $event)" (paste)="onPaste(4, $event)"
                   [@inputFocus]="getInputFocusState(4)" (focus)="onInputFocus(4)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(5, $event)" (keydown)="onKeyDown(5, $event)" (paste)="onPaste(5, $event)"
                   [@inputFocus]="getInputFocusState(5)" (focus)="onInputFocus(5)" (blur)="onInputBlur()" />
          </div>

          <div class="container7">
            <button class="link4" [disabled]="!canVerify || isVerifying" (click)="onVerify()"
                    [@buttonHover]
                    [@buttonPress]="buttonState">
              <img class="svg3" src="assets/icons/shield.svg" alt="verify" />
              <div class="text11">{{ isVerifying ? 'Verificando...' : 'Verifica tu cuenta' }}</div>
            </button>
          </div>

          <!-- Botón de reenvío -->
          <div class="resend-section">
            <div class="resend-text">¿No recibiste el código?</div>
            <button class="resend-button"
                    [disabled]="isResending || resendDisabled"
                    [class.disabled]="resendDisabled"
                    (click)="onResendCode()"
                    [@buttonHover]>
              <span *ngIf="!resendDisabled && !isResending">Reenviar código</span>
              <span *ngIf="isResending">Enviando...</span>
              <span *ngIf="resendDisabled && !isResending">Reenviar en {{ resendCountdown }}s</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <app-footer />
</div>
