<app-header />

<main class="background" [@fadeIn]>
  <section class="container4">
    <div class="container5">
      <div class="background-border">
        <div class="container6">
          <div class="text8">Revisa tu bandeja de entrada</div>
        </div>
        
        <div class="container6">
          <div class="text9">
            Hemos enviado un código de 6 dígitos a <strong>{{ email() || 'tu email' }}</strong>.<br />
            Este código caduca en 10 minutos.
          </div>
        </div>
        
        <div class="background2">
          <div class="iconify-icon">
            <div class="svg3">
              <img src="assets/icons/sparkles.svg" alt="Email enviado" />
            </div>
          </div>
          <div class="container7">
            <div class="container6">
              <div class="text10">Email enviado correctamente</div>
            </div>
            <div class="container6">
              <div class="text11">
                ¿No has recibido el email? Revisa tu carpeta de spam o solicita un nuevo código.
              </div>
            </div>
          </div>
        </div>
        
        <div class="container8">
          <button class="link4" (click)="onEnterCode()" [@buttonHover]>
            <img class="svg4" src="assets/icons/shield.svg" alt="Verificar" />
            <div class="text12">Introducir código de verificación</div>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<app-footer />
