<app-header></app-header>

<div class="new-password-page" [@fadeIn]>
  <!-- Contenido principal -->
  <div class="main-content">
    <div class="content-header">
      <h1 class="page-title">Nueva contraseña</h1>
      
      <!-- Indicador de progreso -->
      <div class="progress-steps">
        <div class="progress-step">
          <div class="step-circle completed"></div>
          <span class="step-label">Email</span>
        </div>
        <img class="step-arrow" src="assets/icons/play.svg" alt="next" />
        <div class="progress-step">
          <div class="step-circle completed"></div>
          <span class="step-label">Código</span>
        </div>
        <img class="step-arrow" src="assets/icons/play.svg" alt="next" />
        <div class="progress-step">
          <div class="step-circle current"></div>
          <span class="step-label">Nueva Contraseña</span>
        </div>
      </div>
    </div>

    <!-- Formulario de nueva contraseña -->
    <form [formGroup]="passwordForm" (ngSubmit)="submit()" class="reset-form" [@shakeError]="shakeForm ? 'shake' : ''">
      <!-- Banner informativo o de éxito -->
      <div class="banner" [class.error]="(formState$ | async)?.error">
        <p *ngIf="!(formState$ | async)?.error">
          Crea una nueva contraseña segura para tu cuenta. Debe cumplir con todos los requisitos de seguridad.
        </p>
        <p *ngIf="(formState$ | async)?.error">{{ (formState$ | async)?.error }}</p>
      </div>

      <!-- Campo de nueva contraseña -->
      <app-form-password 
        label="Nueva contraseña" 
        formControlName="password"
        [showTooltip]="showPasswordTooltip"
        [errors]="passwordForm.get('password')?.errors || null"
        [touched]="passwordForm.get('password')?.touched || false"
        (toggleTooltip)="togglePasswordTooltip()"
        customClass="new-password-input">
      </app-form-password>

      <!-- Campo de confirmar contraseña -->
      <app-form-password 
        label="Confirmar nueva contraseña" 
        formControlName="confirmPassword"
        [showTooltip]="false"
        [showHelpButton]="false"
        [errors]="getConfirmPasswordErrors()"
        [touched]="passwordForm.get('confirmPassword')?.touched || false"
        customClass="new-password-input">
      </app-form-password>

      <p class="form-description">
        Tu nueva contraseña debe ser diferente a contraseñas anteriores y cumplir con las políticas de seguridad.
      </p>

      <!-- Acciones del formulario -->
      <app-form-submit 
        [text]="'Actualizar contraseña'" 
        [loadingText]="'Actualizando...'" 
        [loading]="(formState$ | async)?.isSubmitting || false" 
        [disabled]="passwordForm.invalid" 
        cancelLink="/login" 
        cancelText="Cancelar">
      </app-form-submit>
    </form>
  </div>
</div>

<app-footer></app-footer>
