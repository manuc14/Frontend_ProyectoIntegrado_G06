<div class="page-container">
  <app-header />

  <main class="background" @fadeIn>
    <section class="container3">
      <div class="container4">
        <div class="background-border" [@shakeError]="shakeForm ? 'shake' : ''">
          <!-- Header Section -->
          <div class="otp-header">
            <div class="icon-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
              </svg>
            </div>
            <div class="container5">
              <div class="text8">Autenticación en dos pasos</div>
            </div>
            <div class="container5">
              <div class="text9">Introduce el código de 6 dígitos de Google Authenticator</div>
            </div>
            @if (email()) {
              <div class="email-badge">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
                {{ email() }}
              </div>
            }
          </div>

          <!-- Error Message -->
          @if (errorMessage && hasError) {
            <div class="field-error" @fadeIn>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
              </svg>
              {{ errorMessage }}
            </div>
          }

          <!-- Code Input Fields -->
          <div class="container6">
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(0, $event)" (keydown)="onKeyDown(0, $event)" (paste)="onPaste(0, $event)"
                   [@inputFocus]="focusedInput === 0 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(0)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(1, $event)" (keydown)="onKeyDown(1, $event)" (paste)="onPaste(1, $event)"
                   [@inputFocus]="focusedInput === 1 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(1)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(2, $event)" (keydown)="onKeyDown(2, $event)" (paste)="onPaste(2, $event)"
                   [@inputFocus]="focusedInput === 2 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(2)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(3, $event)" (keydown)="onKeyDown(3, $event)" (paste)="onPaste(3, $event)"
                   [@inputFocus]="focusedInput === 3 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(3)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(4, $event)" (keydown)="onKeyDown(4, $event)" (paste)="onPaste(4, $event)"
                   [@inputFocus]="focusedInput === 4 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(4)" (blur)="onInputBlur()" />
            <input #codeInput type="text" inputmode="numeric" maxlength="1"
                   (input)="onInput(5, $event)" (keydown)="onKeyDown(5, $event)" (paste)="onPaste(5, $event)"
                   [@inputFocus]="focusedInput === 5 ? 'focused' : 'normal'" 
                   (focus)="onInputFocus(5)" (blur)="onInputBlur()" />
          </div>

          <!-- Verify Button -->
          <div class="container7">
            <button class="link4" 
                    [disabled]="!canVerify || isVerifying" 
                    (click)="onVerify()"
                    [@buttonHover]
                    [@buttonPress]="buttonState">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
              </svg>
              <div class="text11">{{ isVerifying ? 'Verificando...' : 'Verificar código' }}</div>
            </button>
          </div>

          <!-- Alternative Options -->
          <div class="alternative-options">
            <button type="button" class="text-link" (click)="onUseBackupCode()" [@buttonHover]>
              ¿Perdiste tu dispositivo? Usa un código de respaldo
            </button>
            <button type="button" class="text-link" (click)="onBackToLogin()" [@buttonHover]>
              Volver al inicio de sesión
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <app-footer />
</div>
