<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <app-modal-header [titulo]="'Editar administrador'" (cerrar)="onCerrar()"></app-modal-header>

      <app-error-container [error]="error"></app-error-container>

      <div class="container2">
        <app-avatar-selector
          [availableAvatars]="availableAvatars"
          [selectedAvatar]="selectedAvatar"
          [nombre]="adminData.nombre"
          (avatarSelected)="selectAvatar($event)">
        </app-avatar-selector>

        <div class="container6">
          <div class="container7">
            <app-input-field
              label="Nombre"
              [value]="adminData.nombre"
              (valueChange)="adminData.nombre = $event"
              (input)="validateNombreLength()"
              placeholder="Nombre"
              errorMessage="El nombre no puede superar 20 caracteres"
              [tooLong]="nombreTooLong"
              [required]="true"
              (tooLongChange)="nombreTooLong = $event">
            </app-input-field>

            <app-input-field
              label="Apellidos"
              [value]="adminData.apellidos"
              (valueChange)="adminData.apellidos = $event"
              (input)="validateApellidosLength()"
              placeholder="Apellidos"
              errorMessage="Los apellidos no pueden superar 20 caracteres"
              [tooLong]="apellidosTooLong"
              [required]="true"
              (tooLongChange)="apellidosTooLong = $event">
            </app-input-field>
          </div>

          <app-form-password
            [value]="adminData.contrasena"
            [showTooltip]="true"
            [errors]="adminData.contrasena.trim() !== '' && !isPasswordStrong ? { passwordPolicy: { minLengthPolicy: true } } : null"
            [touched]="true">
          </app-form-password>

          <app-form-password
            label="Repetir contraseña"
            [value]="adminData.confirmarContrasena"
            [showTooltip]="false"
            [showHelpButton]="false"
            [errors]="passwordMismatch ? { mismatch: true } : null"
            [touched]="true">
          </app-form-password>

          <app-select-field
            label="Departamento"
            [value]="adminData.departamento"
            (valueChange)="adminData.departamento = $event">
            <option value="Operaciones">Operaciones</option>
            <option value="Marketing">Marketing</option>
            <option value="Finanzas">Finanzas</option>
            <option value="Recursos Humanos">Recursos Humanos</option>
            <option value="Soporte">Soporte</option>
          </app-select-field>
        </div>
      </div>

      <div class="horizontal-border">
        <app-toggle-block-button [activo]="adminData.activo" (toggle)="toggleBloquear()"></app-toggle-block-button>
        <app-form-actions [isSaving]="isSaving" (cancelar)="onCancelar()" (guardar)="onGuardarCambios()"></app-form-actions>
      </div>
    </div>
  </div>
</div>
