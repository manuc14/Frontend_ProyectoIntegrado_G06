<app-header></app-header>

<main class="background">
  <div class="container">
    
    <!-- Título de la página con botón de edición -->
    <div class="container2">
      <div class="container3">
        <div class="text">Tu perfil</div>
        <button 
          type="button"
          class="border"
          (click)="toggleEditMode()"
          [title]="isEditMode ? 'Salir del modo edición' : 'Editar perfil'">
          <div class="iconify-icon">
            <img class="svg" src="assets/icons/edit-pencil.svg" alt="Editar" />
          </div>
        </button>
      </div>
    </div>

    <!-- Contenedor principal con fondo blanco -->
    <div class="background-border-shadow">
      
      <!-- Columna izquierda - Selector de Avatar -->
      <div class="container4">
        
        <app-avatar-selector
          [availableAvatars]="availableAvatars"
          [selectedAvatar]="selectedAvatar"
          [nombre]="profileForm.get('firstName')?.value || 'Usuario'"
          (avatarSelected)="onAvatarSelected($event)">
        </app-avatar-selector>
      </div>

      <!-- Columna derecha - Detalles del creador -->
      <div class="container9">
        <div class="margin">
          <div class="container5">
            <div class="text4">Información personal</div>
          </div>
        </div>
        
        <form [formGroup]="profileForm">
          <!-- Primera fila: Nombre y Apellidos -->
          <div class="form-row">
            <div class="field-container">
              <div class="container5">
                <div class="text5">Nombre*</div>
              </div>
              <div class="background-border13">
                <input 
                  type="text"
                  class="text6"
                  formControlName="firstName"
                  placeholder="Escribe aquí tu nombre" />
              </div>
            </div>
            
            <div class="field-container">
              <div class="container5">
                <div class="text7">Apellidos*</div>
              </div>
              <div class="background-border13">
                <input 
                  type="text"
                  class="text8"
                  formControlName="lastName"
                  placeholder="Escribe aquí tus apellidos" />
              </div>
            </div>
          </div>
          
          <!-- Segunda fila: Email -->
          <div class="form-row">
            <div class="field-container full-width">
              <div class="container5">
                <div class="text11">Email</div>
              </div>
              <div class="background-border13">
                <input 
                  type="email"
                  class="text12"
                  formControlName="email"
                  placeholder="email@empresa.com"
                  readonly />
              </div>
            </div>
          </div>
          
          <!-- Tercera fila: Fecha de alta -->
          <div class="form-row">
            <div class="field-container full-width">
              <div class="container5">
                <div class="text13">Fecha de alta</div>
              </div>
              <div class="background-border13">
                <input 
                  type="text"
                  class="text14"
                  formControlName="startDate"
                  placeholder="Fecha de registro"
                  readonly />
              </div>
            </div>
          </div>
          
          <!-- Cuarta fila: Alias y Departamento -->
          <div class="form-row">
            <div class="field-container">
              <div class="container5">
                <div class="text9">Alias</div>
              </div>
              <div class="background-border13">
                <input 
                  type="text"
                  class="text10"
                  formControlName="alias"
                  placeholder="Escribe aquí tu alias" />
              </div>
            </div>
            
            <div class="field-container">
              <div class="container5">
                <div class="text15">Departamento</div>
              </div>
              <app-select-field
                formControlName="department"
                placeholder="Selecciona tu departamento"
                class="text16 department-select">
                <option *ngFor="let dept of departmentOptions" [value]="dept.value">{{ dept.label }}</option>
              </app-select-field>
            </div>
          </div>
        </form>
      </div>

      <!-- Botones de acción - Solo visible en modo edición -->
      <div class="margin2" *ngIf="isEditMode">
        <div class="container17">
          <button 
            type="button" 
            class="border"
            [disabled]="!hasUnsavedChanges"
            (click)="onCancelChanges()">
            <div class="text17">Cancelar</div>
          </button>
          
          <button 
            type="button" 
            class="background-border14"
            [disabled]="!hasUnsavedChanges"
            (click)="onSaveChanges()">
            <div class="text18">Guardar cambios</div>
          </button>
        </div>
      </div>

    </div>
  </div>
</main>
