<app-header></app-header>

<main class="background">
  <div class="container">
    
    <!-- Título de la página -->
    <div class="container2">
      <div class="container3">
        <div class="text">Tu perfil</div>
      </div>
    </div>

    <!-- Mensaje de éxito -->
    <div class="success-message" *ngIf="showSuccessMessage">
      <div class="success-content">
        <img src="assets/icons/check-circle.svg" alt="Éxito" class="success-icon" />
        {{ successMessage }}
      </div>
    </div>

    <!-- Contenedor principal con fondo blanco -->
    <div class="background-border-shadow">
      
      <!-- Columna izquierda - Selector de Avatar -->
      <div class="container4" [class.avatar-disabled]="!isEditMode">
        <app-avatar-selector
          [availableAvatars]="availableAvatars"
          [selectedAvatar]="selectedAvatar"
          [nombre]="profileForm.get('firstName')?.value || 'Usuario'"
          (avatarSelected)="onAvatarSelected($event)">
        </app-avatar-selector>
      </div>

      <!-- Columna derecha - Detalles del administrador -->
      <div class="container9">
        <div class="margin">
          <div class="container5">
            <div class="text4">Información personal</div>
            <!-- Botón de edición -->
            <button 
              type="button"
              class="edit-button-top-right"
              [class.active]="isEditMode"
              (click)="toggleEditMode()"
              [title]="isEditMode ? 'Salir del modo edición' : 'Editar perfil'">
              <img class="edit-icon" src="assets/icons/edit-pencil.svg" alt="Editar" />
            </button>
          </div>
        </div>
        
        <form [formGroup]="profileForm">
          <!-- Primera fila: Nombre y Apellidos -->
          <div class="form-row">
            <div class="field-container">
              <app-form-input
                label="Nombre"
                type="text"
                [maxlength]="maxNombre"
                placeholder="Escribe aquí tu nombre"
                [required]="true"
                formControlName="firstName"
                [errors]="firstNameControl?.errors ?? null"
                [touched]="firstNameControl?.touched || false"
                [disabled]="!isEditMode">
              </app-form-input>
            </div>
            
            <div class="field-container">
              <app-form-input
                label="Apellidos"
                type="text"
                [maxlength]="maxApellidos"
                placeholder="Escribe aquí tus apellidos"
                [required]="true"
                formControlName="lastName"
                [errors]="lastNameControl?.errors ?? null"
                [touched]="lastNameControl?.touched || false"
                [disabled]="!isEditMode">
              </app-form-input>
            </div>
          </div>
          
          <!-- Segunda fila: Email -->
          <div class="form-row">
            <div class="field-container full-width">
              <app-form-input
                label="Email"
                type="email"
                [maxlength]="maxEmail"
                placeholder="email@empresa.com"
                [required]="false"
                formControlName="email"
                [disabled]="true">
              </app-form-input>
            </div>
          </div>
          
          <!-- Tercera fila: Fecha de alta -->
          <div class="form-row">
            <div class="field-container full-width">
              <app-form-date
                label="Fecha de alta"
                placeholder="Fecha de registro"
                [required]="false"
                formControlName="startDate"
                [disabled]="true">
              </app-form-date>
            </div>
          </div>
          
          <!-- Cuarta fila: Departamento -->
          <div class="form-row">
            <div class="field-container full-width">
              <label class="field-label" for="department-select">Departamento</label>
              <app-select-field
                id="department-select"
                formControlName="department"
                placeholder="Selecciona tu departamento"
                [disabled]="!isEditMode"
                class="text16 department-select">
                <option *ngFor="let dept of departmentOptions" [value]="dept.value">{{ dept.label }}</option>
              </app-select-field>
            </div>
          </div>
        </form>
      </div>

      <!-- Botones de acción - Solo visible en modo edición -->
      <div class="margin2" *ngIf="isEditMode">
        <div class="container17">
          <button 
            type="button" 
            class="border"
            [disabled]="!hasUnsavedChanges"
            (click)="onCancelChanges()">
            <div class="text17">Cancelar</div>
          </button>
          
          <button 
            type="button" 
            class="background-border14"
            [disabled]="!hasUnsavedChanges"
            (click)="onSaveChanges()">
            <div class="text18">Guardar cambios</div>
          </button>
        </div>
      </div>

    </div>
  </div>
</main>
