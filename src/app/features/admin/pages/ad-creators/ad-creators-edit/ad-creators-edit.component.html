<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <app-modal-header [titulo]="'Editar creador de contenido'" (cerrar)="onCerrar()"></app-modal-header>

      <app-error-container [error]="error"></app-error-container>

      <div class="container2">
        <app-avatar-selector
          [availableAvatars]="availableAvatars"
          [selectedAvatar]="selectedAvatar"
          [nombre]="creatorData.nombre"
          (avatarSelected)="selectAvatar($event)">
        </app-avatar-selector>

        <div class="container6">
          <div class="container7">
            <app-input-field
              label="Nombre"
              [value]="creatorData.nombre"
              (valueChange)="creatorData.nombre = $event"
              (input)="validateNombreLength()"
              placeholder="Nombre"
              errorMessage="El nombre no puede superar 20 caracteres"
              [tooLong]="nombreTooLong"
              [required]="true"
              (tooLongChange)="nombreTooLong = $event">
            </app-input-field>

            <app-input-field
              label="Apellidos"
              [value]="creatorData.apellidos"
              (valueChange)="creatorData.apellidos = $event"
              (input)="validateApellidosLength()"
              placeholder="Apellidos"
              errorMessage="Los apellidos no pueden superar 20 caracteres"
              [tooLong]="apellidosTooLong"
              [required]="true"
              (tooLongChange)="apellidosTooLong = $event">
            </app-input-field>
          </div>

          <app-input-field
            label="Correo"
            type="email"
            [value]="creatorData.correo"
            (valueChange)="creatorData.correo = $event"
            (input)="validateCorreo()"
            placeholder="Correo"
            errorMessage="El formato del correo no es válido"
            [tooLong]="correoInvalid"
            [required]="true"
            (tooLongChange)="correoInvalid = $event">
          </app-input-field>

          <app-input-field
            label="Alias"
            [value]="creatorData.alias"
            (valueChange)="creatorData.alias = $event"
            (input)="validateAliasLength()"
            placeholder="Alias"
            errorMessage="El alias no puede superar 20 caracteres"
            [tooLong]="aliasTooLong"
            [required]="true"
            (tooLongChange)="aliasTooLong = $event">
          </app-input-field>

          <app-textarea-field
            label="Descripción"
            [value]="creatorData.descripcion"
            (valueChange)="creatorData.descripcion = $event"
            (input)="validateDescripcionLength()"
            placeholder="Descripción"
            errorMessage="La descripción no puede superar 200 caracteres"
            [tooLong]="descripcionTooLong"
            (tooLongChange)="descripcionTooLong = $event">
          </app-textarea-field>

          <app-select-field
            label="Especialidad"
            [value]="creatorData.especialidad"
            (valueChange)="creatorData.especialidad = $event">
            <option value="Lifestyle">Lifestyle</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Cocina">Cocina</option>
            <option value="Deportes">Deportes</option>
            <option value="Arte">Arte</option>
          </app-select-field>

          <div class="container8">
            <div class="container9">
              <div class="text7">Tipo de Contenido</div>
            </div>
            <app-tipo-contenido-buttons
              [value]="creatorData.tipoContenido"
              (valueChange)="creatorData.tipoContenido = $event">
            </app-tipo-contenido-buttons>
          </div>

          <app-form-password
            [value]="creatorData.contrasena"
            [showTooltip]="true"
            [errors]="creatorData.contrasena.trim() !== '' && !isPasswordStrong ? { passwordPolicy: { minLengthPolicy: true } } : null"
            [touched]="true">
          </app-form-password>

          <app-form-password
            label="Repetir contraseña"
            [value]="creatorData.confirmarContrasena"
            [showTooltip]="false"
            [showHelpButton]="false"
            [errors]="passwordMismatch ? { mismatch: true } : null"
            [touched]="true">
          </app-form-password>
        </div>
      </div>

      <div class="horizontal-border">
        <app-toggle-block-button [activo]="creatorData.activo" (toggle)="toggleBloquear()"></app-toggle-block-button>
        <app-form-actions [isSaving]="isSaving" (cancelar)="onCancelar()" (guardar)="onGuardarCambios()"></app-form-actions>
      </div>
    </div>
  </div>
</div>
