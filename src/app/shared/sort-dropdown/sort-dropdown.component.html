<div class="sort-dropdown-container">
  <!-- Botón principal -->
  <button 
    type="button"
    class="sort-button"
    [@buttonHover]
    [@buttonPress]
    (click)="toggleDropdown()"
    [class.active]="isOpen"
    [attr.aria-label]="'Ordenar contenido'"
    [attr.aria-expanded]="isOpen">
    
    <div class="sort-button-content">
      <div class="icon-container">
        <img 
          src="assets/admin/ordenar_por.svg" 
          alt="icono ordenar" 
          width="18" 
          height="18"
          class="sort-icon"/>
      </div>
      <span class="sort-text">Ordenar</span>
      <div class="arrow-container">
        <svg 
          class="arrow-icon"
          [class.rotated]="isOpen"
          width="12" 
          height="12" 
          viewBox="0 0 12 12" 
          fill="none">
          <path 
            d="M3 4.5L6 7.5L9 4.5" 
            stroke="currentColor" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </button>

  <!-- Dropdown menu -->
  <div 
    class="dropdown-menu"
    [class.open]="isOpen"
    (click)="onDropdownClick($event)"
    (keydown)="onKeyDown($event)"
    [attr.aria-expanded]="isOpen"
    role="menu">
    
    <div class="dropdown-header">
      <span>Ordenar por:</span>
    </div>
    
    <div class="dropdown-options">
      <button
        type="button"
        class="dropdown-option"
        *ngFor="let option of sortOptions"
        [class.selected]="selectedSort?.id === option.id"
        (click)="selectSort(option)"
        role="menuitem"
        [attr.aria-pressed]="selectedSort?.id === option.id">
        
        <span class="option-label">{{ option.label }}</span>
        
        <!-- Indicador de selección -->
        <div class="selection-indicator" *ngIf="selectedSort?.id === option.id">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path 
              d="M13.5 4.5L6 12L2.5 8.5" 
              stroke="currentColor" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
          </svg>
        </div>
      </button>
    </div>
  </div>
</div>
