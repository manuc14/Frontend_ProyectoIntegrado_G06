<div class="container8">
  <div class="container9">
    <div class="text10">{{ label }}</div>
  </div>
  <div class="background-border9" [class.error]="passwordMismatch">
    <input
      [type]="showConfirmPassword ? 'text' : 'password'"
      class="input-field"
      [(ngModel)]="confirmValue"
      (input)="onInput()"
      (blur)="onBlur()"
      [placeholder]="placeholder"
    />
    <button
      type="button"
      class="toggle-password"
      (click)="toggleVisibility()"
      [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path *ngIf="!showConfirmPassword" d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" [attr.stroke]="'var(--foreground)'" stroke-width="2"/>
        <path *ngIf="showConfirmPassword" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" [attr.stroke]="'var(--foreground)'" stroke-width="2"/>
      </svg>
    </button>
  </div>
  <div class="error-message" *ngIf="passwordMismatch">
    Las contraseñas no coinciden
  </div>
  <div class="container10" *ngIf="!passwordMismatch">
    <div class="iconify-icon2">
      <div class="svg2">
        <img class="group" src="assets/admin/info.svg" alt="icono info" height="18" width="18" />
      </div>
    </div>
    <div class="text11">Repite la contraseña para confirmar.</div>
  </div>
</div>
