<!-- src/app/shared/components/admin-entity-form/admin-entity-form.component.html -->
<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <form [formGroup]="entityForm" (ngSubmit)="onSubmit()">
        <div class="horizontal-border">
          <div class="container">
            <div class="text">{{ title }}</div>
          </div>
          <button class="border" type="button" (click)="goBack()" [@buttonHover] [@buttonPress]>
            <div class="iconify-icon">
              <img class="svg" src="assets/admin/salir.svg" alt="icono salir" height="18" width="19"/>
            </div>
            <div class="text2">Cerrar</div>
          </button>
        </div>
        <div class="container2">
          <!-- Mensaje de error general -->
          <app-error-container [error]="currentFormState?.error"></app-error-container>

          <!-- Sección de foto -->
          <div class="avatar-section">
            <div class="current-avatar">
              <img [src]="currentFormState?.imageState?.selectedImage || 'assets/admin/admin_default.png'" alt="Avatar actual" class="avatar-preview">
            </div>
            <button type="button" class="close-btn" (click)="openAvatarModal()" aria-label="Elegir avatar predefinido">
              Elegir predefinida
            </button>
          </div>

          <!-- Modal para selección de avatar -->
          <div class="modal-overlay" *ngIf="showAvatarModal" (click)="closeAvatarModal()" (keydown)="onModalKeyDown($event)" tabindex="-1">
            <div class="modal-content" (click)="$event.stopPropagation()" (keydown)="onModalKeyDown($event)" tabindex="-1">
              <div class="modal-header">
                <h3>Seleccionar avatar predefinido</h3>
                <button type="button" class="close-btn" (click)="closeAvatarModal()" aria-label="Cerrar">
                  ×
                </button>
              </div>
              <div class="modal-body">
                <app-avatar-selector
                  [availableAvatars]="currentFormState?.imageState?.images || []"
                  [selectedAvatar]="currentFormState?.imageState?.selectedImage || ''"
                  [nombre]="entityForm.get('nombre')?.value"
                  (avatarSelected)="onAvatarSelected($event)">
                </app-avatar-selector>
              </div>
            </div>
          </div>

          <!-- Campo Nombre -->
          <app-form-input
            label="Nombre"
            formControlName="nombre"
            placeholder="Nombre"
            [required]="true"
            [errors]="entityForm.get('nombre')?.errors ?? null"
            [touched]="entityForm.get('nombre')?.touched ?? false">
          </app-form-input>

          <!-- Campo Apellidos -->
          <app-form-input
            label="Apellidos"
            formControlName="apellidos"
            placeholder="Apellidos"
            [required]="true"
            [errors]="entityForm.get('apellidos')?.errors ?? null"
            [touched]="entityForm.get('apellidos')?.touched ?? false">
          </app-form-input>

          <!-- Campo Email -->
          <app-form-input
            label="Email"
            type="email"
            formControlName="email"
            [placeholder]="emailPlaceholder"
            [required]="true"
            [errors]="entityForm.get('email')?.errors ?? null"
            [touched]="entityForm.get('email')?.touched ?? false">
          </app-form-input>

          <!-- Campo Alias (solo para creators) -->
          <app-form-input
            *ngIf="entityType === 'creator'"
            label="Alias"
            formControlName="alias"
            [placeholder]="aliasPlaceholder"
            subhint="{{ aliasHelpText }}"
            [required]="true"
            [errors]="entityForm.get('alias')?.errors ?? null"
            [touched]="entityForm.get('alias')?.touched ?? false">
          </app-form-input>

          <!-- Campo Contraseña -->
          <app-form-password
            label="Contraseña"
            formControlName="password"
            placeholder="••••••••"
            [showTooltip]="showTooltipPassword"
            (toggleTooltip)="onToggleTooltipPassword()"
            [required]="true"
            [errors]="entityForm.get('password')?.errors ?? null"
            [touched]="entityForm.get('password')?.touched ?? false">
          </app-form-password>

          <!-- Campo Repetir contraseña -->
          <app-form-password
            label="Repetir contraseña"
            formControlName="repetirPassword"
            placeholder="••••••••"
            [showTooltip]="false"
            [showHelpButton]="false"
            [required]="true"
            [errors]="entityForm.get('repetirPassword')?.errors ?? null"
            [touched]="entityForm.get('repetirPassword')?.touched ?? false">
          </app-form-password>

          <!-- Campo Select (departamento/especialidad) -->
          <app-select-field
            [label]="selectLabel"
            formControlName="{{ selectFieldName }}"
            [hasError]="!!(entityForm.get(selectFieldName)?.invalid && entityForm.get(selectFieldName)?.touched)">
            <option *ngFor="let opt of selectOptions" [value]="opt">{{ opt }}</option>
          </app-select-field>

          <!-- Campo Tipo de contenido (solo creator) -->
          <div class="background11" *ngIf="entityType === 'creator'">
            <div class="container8">
              <div class="text15">Tipo de contenido *</div>
            </div>
            <div class="container10" [class.error-border]="entityForm.get('tipoContenido')?.invalid && entityForm.get('tipoContenido')?.touched">
              <button class="background-border3" type="button" (click)="entityForm.patchValue({ tipoContenido: 'audio' })" [@buttonHover] [@buttonPress] [class.selected]="entityForm.get('tipoContenido')?.value === 'audio'">
                <div class="iconify-icon2">
                  <img class="svg5" src="assets/admin/tipo_creador.svg" alt="selector audio" height="14" width="14"/>
                </div>
                <div class="audio">Audio</div>
              </button>
              <button class="background-border3" type="button" (click)="entityForm.patchValue({ tipoContenido: 'video' })" [@buttonHover] [@buttonPress] [class.selected]="entityForm.get('tipoContenido')?.value === 'video'">
                <div class="iconify-icon2">
                  <img class="svg6" src="assets/admin/tipo_creador.svg" alt="selector video" height="14" width="14"/>
                </div>
                <div class="video">Video</div>
              </button>
            </div>
            <div class="container11">
              <div class="text16">Solo una opción es válida</div>
            </div>
          </div>

          <!-- Campo Descripción (solo creator) -->
          <app-textarea-field
            *ngIf="entityType === 'creator'"
            label="Descripción"
            formControlName="descripcion"
            placeholder="Breve bio o descripción del creador">
          </app-textarea-field>
        </div>

        <app-form-actions
          [isSaving]="currentFormState?.isSubmitting"
          (cancelar)="goBack()"
          (guardar)="onSubmit()">
        </app-form-actions>
      </form>
    </div>
  </div>
</div>
