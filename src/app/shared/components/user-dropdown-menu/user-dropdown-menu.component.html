<div class="user-dropdown-container">
  <!-- Avatar del usuario (trigger del dropdown) -->
  <button
    class="avatar-button"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="isDropdownOpen"
    [attr.aria-label]="'Menú de usuario de ' + getUserDisplayName()"
    type="button">
    <img
      [src]="avatarUrl"
      [alt]="'Avatar de ' + getUserDisplayName()"
      class="user-avatar" />
  </button>

  <!-- Dropdown menu -->
  <div
    class="dropdown-menu"
    [class.open]="isDropdownOpen"
    role="menu"
    aria-orientation="vertical">
    
    <!-- Sección de información del usuario -->
    <div class="user-info-section">
      <img
        [src]="avatarUrl"
        [alt]="'Avatar de ' + getUserDisplayName()"
        class="user-avatar-large" />
      <div class="user-details">
        <div class="user-name">{{ getUserDisplayName() }}</div>
        <div class="user-email">{{ getUserEmail() }}</div>
      </div>
    </div>

    <!-- Separador -->
    <div class="menu-divider"></div>

    <!-- Opciones del menú -->
    <div class="menu-options">
      <button
        *ngFor="let option of menuOptions"
        class="menu-option"
        [class.logout-option]="isLogoutOption(option)"
        (click)="executeMenuAction(option)"
        role="menuitem"
        type="button">
        <div class="option-icon">
          <!-- Icono Home -->
          <svg *ngIf="option.iconSvg === 'home'" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          
          <!-- Icono User -->
          <svg *ngIf="option.iconSvg === 'user'" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          
          <!-- Icono Upload -->
          <svg *ngIf="option.iconSvg === 'upload'" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          
          <!-- Icono List -->
          <svg *ngIf="option.iconSvg === 'list'" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 6L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 6.01L4.01 5.99889" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 12.01L4.01 11.9989" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 18.01L4.01 17.9989" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 12L20 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 18L20 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          
          <!-- Icono Logout -->
          <svg *ngIf="option.iconSvg === 'logout'" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="option-label">{{ option.label }}</span>
      </button>
    </div>
  </div>
</div>
