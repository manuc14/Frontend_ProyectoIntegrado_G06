<a class="content-card" [class.content-card--private]="isCreatorView && isPrivate" (click)="navigateToPreview($event)">
  <!-- Miniatura del contenido -->
  <div class="content-card__thumbnail">
    <img [src]="miniaturaUrl" [alt]="contenido.titulo" class="content-card__thumbnail-img">
    
    <!-- Badge de Contenido Privado (solo en vista de creador) -->
    <div *ngIf="isCreatorView && isPrivate" class="content-card__badge content-card__badge--private">
      <svg class="content-card__badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1ZM12 11.99H19C18.47 16.11 15.72 19.78 12 20.93V12H5V6.3L12 3.19V11.99Z" fill="currentColor"/>
      </svg>
      <span>Privado</span>
    </div>
    
    <!-- Badge Premium -->
    <div *ngIf="contenido.contenidoVip" class="content-card__badge content-card__badge--premium">
      <svg class="content-card__badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/>
      </svg>
      <span>Premium</span>
    </div>
    
    <!-- Badge de Calidad (solo videos) -->
    <div *ngIf="contenido.tipo === 'VIDEO' && contenido.resolucion" class="content-card__badge content-card__badge--quality">
      {{ contenido.resolucion }}
    </div>
    
    <!-- Duración -->
    <div class="content-card__badge content-card__badge--duration">
      {{ duracionFormateada }}
    </div>
    
    <!-- Badge de Edad -->
    <div *ngIf="contenido.restriccionEdad !== null && contenido.restriccionEdad !== undefined" class="content-card__badge content-card__badge--age">
      {{ contenido.restriccionEdad }}+
    </div>
  </div>
  
  <!-- Información del contenido -->
  <div class="content-card__info">
    <!-- Título -->
    <h3 class="content-card__title">{{ contenido.titulo }}</h3>
    
    <!-- Información del creador y categoría (más pequeño) -->
    <p *ngIf="contenido.creadorAlias || contenido.categoria" class="content-card__meta">
      <span *ngIf="contenido.creadorAlias" class="content-card__creator">
        {{ contenido.creadorAlias }}
      </span>
      <span *ngIf="contenido.creadorAlias && contenido.categoria" class="content-card__separator">•</span>
      <span *ngIf="contenido.categoria" class="content-card__category">
        {{ contenido.categoria }}
      </span>
    </p>
    
    <!-- Etiquetas -->
    <div class="content-card__tags" *ngIf="contenido.tags && contenido.tags.length > 0">
      <span *ngFor="let tag of etiquetasVisibles" class="content-card__tag">
        {{ tag }}
      </span>
    </div>
  </div>
</a>
