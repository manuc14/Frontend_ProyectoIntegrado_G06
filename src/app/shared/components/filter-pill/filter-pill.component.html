<button 
  class="filter-pill"
  [class.active]="isActive"
  [class.primary]="isPrimary"
  (click)="handleClick()">
  
  <!-- SVG Icons -->
  <span *ngIf="iconType" class="filter-pill__icon">
    <!-- Video Icon -->
    <svg *ngIf="iconType === 'video'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/>
    </svg>
    
    <!-- Audio Icon -->
    <svg *ngIf="iconType === 'audio'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/>
    </svg>
    
    <!-- Premium/VIP Icon -->
    <svg *ngIf="iconType === 'premium'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"/>
    </svg>
    
    <!-- Age Icon -->
    <svg *ngIf="iconType === 'age'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/>
    </svg>
    
    <!-- Quality/HD Icon -->
    <svg *ngIf="iconType === 'quality'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V5H19M7,9V15H9V13H11V15H13V9H11V11H9V9M15,11V13H17V15H15V11H15M15,9V11H17A2,2 0 0,1 19,13V15A2,2 0 0,1 17,17H15A2,2 0 0,1 13,15V13A2,2 0 0,1 15,11V9H17V9H15Z"/>
    </svg>
    
    <!-- Check Icon -->
    <svg *ngIf="iconType === 'check'" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/>
    </svg>
  </span>
  
  <!-- Fallback para icon (deprecated) -->
  <img *ngIf="!iconType && icon" [src]="icon" alt="" class="filter-pill__icon">
  
  <span class="filter-pill__label">{{ label }}</span>
</button>
