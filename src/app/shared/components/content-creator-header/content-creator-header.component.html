<!-- Local header for Content Creator (logo left, upload + avatar right) -->
<header class="header local-creator-header" role="banner">
  <div class="brand-section">
    <div class="logo-container">
      <img src="assets/icons/logo_v1.png" alt="ESIMedia" class="logo" />
    </div>
    <div class="brand-text">ESIMedia</div>
  </div>

  <div class="header-actions">
    <button *ngIf="!isOnUploadPage" class="header-upload-button" (click)="navigateToUpload()" aria-label="Subir contenido">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9,16V10H5L12,3L19,10H15V16H9M5,20V18H19V20H5Z"/>
      </svg>
      Subir contenido
    </button>

    <div class="avatar-section">
      <img 
        [src]="getAvatarUrl()" 
        [alt]="'avatar de ' + (currentUser?.nombre || 'usuario')" 
        class="avatar-image"
        height="32" 
        width="32"/>
      <div class="background2" (click)="logout()" (keydown.enter)="logout()" style="cursor: pointer;">
        <div class="text2">Cerrar sesión</div>
      </div>
    </div>
  </div>
</header>
