<div class="actions" [class]="customClass">
  <button class="btn primary" type="submit"
          [disabled]="disabled || loading"
          (click)="onSubmit()">
    {{ loading ? loadingText : text }}
  </button>
  <a *ngIf="showCancel" [routerLink]="cancelLink" class="btn ghost" (click)="onCancel()">{{ cancelText }}</a>
</div>
