<label [class]="customClass">
  <span>
    {{ label }} *
    <button *ngIf="showHelpButton" type="button" class="help" aria-label="Requisitos de contraseña"
            (click)="onToggleTooltip()"
            [attr.aria-expanded]="showTooltip">
      ?
      <div class="tooltip" role="tooltip" *ngIf="showTooltip">
        <strong>Requisitos de contraseña</strong>
        <ul class="password-requirements">
          <li>Mínimo 8 caracteres</li>
          <li>Al menos 1 mayúscula que no esté en primera posición</li>
          <li>Al menos 1 carácter especial</li>
          <li>Al menos 1 número</li>
        </ul>
      </div>
    </button>
  </span>
  <div class="input-with-toggle">
    <input [type]="showPassword ? 'text' : 'password'"
           [value]="value"
           [disabled]="disabled"
           (input)="onInputChange($event)"
           (focus)="onFocus()"
           (blur)="onBlur()" />
    <button type="button" class="password-toggle"
            (click)="toggleVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
      <img [src]="showPassword ? 'assets/icons/eye-off-svgrepo-com.svg' : 'assets/icons/eye-svgrepo-com.svg'"
           [alt]="showPassword ? 'Ocultar' : 'Mostrar'" />
    </button>
  </div>
  <ng-container *ngIf="touched && errors">
    <small class="field-error" *ngIf="errors?.['required']">La contraseña es obligatoria.</small>
    <small class="field-error" *ngIf="errors?.['minlength'] || errors?.['passwordPolicy']?.['minLengthPolicy']">La contraseña debe tener al menos 8 caracteres.</small>
    <small class="field-error" *ngIf="errors?.['passwordPolicy']?.['uppercasePolicy'] && !(errors?.['minlength'] || errors?.['passwordPolicy']?.['minLengthPolicy'])">Incluye al menos 1 mayúscula que no sea la primera.</small>
    <small class="field-error" *ngIf="errors?.['passwordPolicy']?.['specialPolicy'] && !(errors?.['minlength'] || errors?.['passwordPolicy']?.['minLengthPolicy'])">Incluye al menos 1 carácter especial.</small>
    <small class="field-error" *ngIf="errors?.['passwordPolicy']?.['numberPolicy'] && !(errors?.['minlength'] || errors?.['passwordPolicy']?.['minLengthPolicy'])">Incluye al menos 1 número.</small>
    <small class="field-error" *ngIf="errors?.['mismatch']">Las contraseñas no coinciden.</small>
  </ng-container>
</label>
