<div class="container8">
  <div class="container9">
    <div class="text5">{{ label }}</div>
  </div>
  <div class="background-border9" [class.error]="tooLong">
    <input
      [type]="type"
      class="input-field"
      [(ngModel)]="value"
      (input)="onInput()"
      [placeholder]="placeholder"
      [required]="required"
    />
  </div>
  <div class="error-message" *ngIf="tooLong">
    {{ errorMessage }}
  </div>
</div>
