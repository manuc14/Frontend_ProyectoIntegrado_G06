<div class="container8">
  <div class="container9">
    <div class="text5">{{ label }}</div>
  </div>
  <div class="background-border9" [class.error]="tooLong" [class.readonly]="readonly">
    <input
      [type]="type"
      class="input-field"
      [class.readonly]="readonly"
      [value]="value"
      (input)="onInput($event)"
      [placeholder]="placeholder"
      [required]="required"
      [readonly]="readonly"
      [disabled]="disabled"
    />
  </div>
  <div class="error-message" *ngIf="tooLong">
    {{ errorMessage }}
  </div>
</div>
