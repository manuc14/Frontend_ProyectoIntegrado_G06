<!-- src/app/pages/ad-admin/ad-admin.component.html -->
<div class="background" [@fadeIn]>

  <button
    class="sidebar-overlay"
    type="button"
    [class.show]="sidebarVisible"
    (click)="closeSidebar()"
    [attr.aria-label]="'Cerrar menú lateral'">
  </button>

  <div class="background-horizontal-border">
    <div class="header-left">
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="'Abrir menú de navegación'"
        [attr.aria-expanded]="sidebarVisible">
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12H21M3 6H21M3 18H21" stroke="#3d4656" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="container">
        <div class="iconify-icon">
          <img class="svg" ngSrc="assets/admin/logo_v2.svg" alt="logo ESIMedia" height="32" width="32"/>
        </div>
        <div class="container2">
          <div class="text">ESIMedia</div>
        </div>
      </div>
    </div>

    <div class="container">
      <img class="admin" ngSrc="assets/admin/admin_default.png" alt="foto de usuario actual" height="29"
           width="29"/>
      <div class="background2">
        <div class="text2">Cerrar sesión</div>
      </div>
    </div>
  </div>

  <div class="container3">
    <div class="background-vertical-border" [class.show]="sidebarVisible">
      <div class="container4">
        <div class="text3">Navegación</div>
      </div>
      <button class="container6" type="button" (click)="navigateToUsers()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="group" ngSrc="assets/admin/usuarios_negro.svg" alt="icono usuarios" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text5">Usuarios</div>
          </div>
        </div>
      </button>
      <button class="background3" type="button" (click)="navigateToAdmins()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="svg3" ngSrc="assets/admin/administradores_blanco.svg" alt="icono administradores" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text4">Administradores</div>
          </div>
        </div>
      </button>
      <button class="container6" type="button" (click)="navigateToCreators()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="group2" ngSrc="assets/admin/creadores.svg" alt="icono creadores de contenido" width="18" height="18"/>
          </div>
          <div class="container2">
            <div class="text6">Creadores de Contenido</div>
          </div>
        </div>
      </button>
      <button class="container6" type="button">
        <div class="container5">
          <div class="iconify-icon">
            <img class="group3" ngSrc="assets/admin/configuracion.svg" alt="icono configuración" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text7">Configuración</div>
          </div>
        </div>
      </button>
    </div>

    <div class="background4">
      <div class="margin">
        <div class="container7">
          <div class="container8">
            <div class="text8">Administradores</div>
          </div>
          <button class="background5" type="button" (click)="addNewAdmin()">
            <div class="iconify-icon2">
              <img class="group4" ngSrc="assets/admin/add.svg" alt="icono añadir" height="18" width="18"/>
            </div>
            <div class="text9">Añadir administrador</div>
          </button>
        </div>
      </div>

      <div class="margin">
        <!-- Filtros de administradores -->
        <app-filter-buttons
          [filterGroups]="filterGroups"
          (filterChange)="onFilterChange($event)"
          (clearAll)="onClearAllFilters()">
        </app-filter-buttons>
        
        <div class="search-section">
          <app-search-bar 
            [searchTerm]="searchTerm"
            placeholder="Buscar por nombre, email, departamento…"
            ariaLabel="Campo de búsqueda de administradores"
            (search)="onSearch($event)"
            (clear)="onClearSearch()">
          </app-search-bar>
          
          <!-- Dropdown de ordenamiento -->
          <app-sort-dropdown
            [sortOptions]="sortOptions"
            [selectedSort]="selectedSort"
            (sortChange)="onSortChange($event)">
          </app-sort-dropdown>
        </div>
      </div>

      <div class="container11" [@shakeError]>
        <div class="background-border2">
          <div class="background6">
            <div class="container2"><div class="text11">Foto</div></div>
            <div class="container2"><div class="text12">Nombre</div></div>
            <div class="container2"><div class="text13">Apellidos</div></div>
            <div class="container2"><div class="text14">Email</div></div>
            <div class="container2"><div class="text15">Departamento</div></div>
            <div class="container2"><div class="text16">Rol</div></div>
            <div class="container2"><div class="text17">Estado</div></div>
            <div class="container2"><div class="text18">Editar</div></div>
            <div class="container2"><div class="text19">Eliminar</div></div>
          </div>

          <div class="container12">
            <!-- Mostrar mensaje si no hay resultados -->
            <div *ngIf="filteredAdmins.length === 0" class="no-results">
              <div class="no-results-content">
                <p>{{ getNoResultsMessage() }}</p>
                <button type="button" (click)="clearSearchAndFilters()" class="clear-search-btn">
                  {{ getClearButtonText() }}
                </button>
              </div>
            </div>

            <!-- Lista dinámica de administradores -->
            <div 
              *ngFor="let admin of filteredAdmins; let i = index; trackBy: trackByAdminId" 
              class="horizontal-border"
              [class.horizontal-border2]="i > 0">
              <div class="container13">
                <img 
                  [ngSrc]="admin.photo" 
                  [alt]="'foto de ' + admin.name" 
                  height="28" 
                  width="28"/>
              </div>
              <div class="container2"><div class="text20">{{ admin.name }}</div></div>
              <div class="container2"><div class="text21">{{ admin.lastName }}</div></div>
              <div class="container14"><div class="text23">{{ admin.email }}</div></div>
              <div class="container2"><div class="text24">{{ admin.department }}</div></div>
              <div class="container2"><div class="text-role">{{ admin.role }}</div></div>
              <div class="container15">
                <div class="background-border3">
                  <img 
                    [ngSrc]="admin.status === 'activo' ? 'assets/admin/activo.svg' : 'assets/admin/bloqueado.svg'" 
                    [alt]="'estado ' + admin.status" 
                    height="18" 
                    width="19"/>
                </div>
              </div>
              <div class="container16">
                <button 
                  type="button"
                  class="background-border4"
                  [attr.aria-label]="'Editar ' + admin.name">
                  <img src="assets/admin/editar.svg" alt="editar administrador" height="18" width="18"/>
                </button>
              </div>
              <div class="container16">
                <button 
                  type="button"
                  class="background7"
                  [attr.aria-label]="'Eliminar ' + admin.name">
                  <img src="assets/admin/eliminar.svg" alt="eliminar administrador" height="18" width="18"/>
                </button>
              </div>
          </div>
          </div>
        </div>
      </div>

      <div class="margin2">
        <div class="container17">
          <div class="container18">
            <div class="text44">Mostrando 1–5 de 36</div>
          </div>
          <div class="container19">
            <div class="border" [@buttonHover] [@buttonPress]>
              <div class="iconify-icon4">
                <img class="svg18" ngSrc="assets/admin/anterior.svg" alt="icono anterior" height="18" width="19"/>
              </div>
              <div class="text45">Anterior</div>
            </div>
            <div class="border2" [@buttonHover] [@buttonPress]>
              <div class="text46">Siguiente</div>
              <div class="iconify-icon5">
                <img class="svg19" ngSrc="assets/admin/siguiente.svg" alt="icono siguiente" height="18" width="18"/>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
