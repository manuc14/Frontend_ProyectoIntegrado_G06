<!-- src/app/pages/ad-admin/ad-admin.component.html -->
<div class="background" [@fadeIn]>

  <app-admin-header [sidebarVisible]="sidebarVisible" (toggleSidebar)="toggleSidebar()"></app-admin-header>

  <div class="container3">
    <app-admin-sidebar [visible]="sidebarVisible" (navigate)="handleNav($event)"></app-admin-sidebar>

    <div class="background4">
      <div class="margin">
        <div class="container7">
          <div class="container8">
            <div class="text8">Administradores</div>
          </div>
          <button class="background9" type="button" (click)="addNewAdmin()">
            <div class="iconify-icon2">
              <img class="group4" ngSrc="assets/admin/add.svg" alt="icono añadir" height="18" width="18"/>
            </div>
            <div class="text4">Añadir administrador</div>
          </button>
        </div>
      </div>

      <div class="margin">
        <!-- Filtros de administradores -->
        <app-filter-buttons
          [filterGroups]="filterGroups"
          (filterChange)="onFilterChange($event)"
          (clearAll)="onClearAllFilters()">
        </app-filter-buttons>
        
        <div class="search-section">
          <app-search-bar 
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchTermChange($event)"
            placeholder="Buscar por nombre, email, departamento…"
            ariaLabel="Campo de búsqueda de administradores"
            (clear)="onClearSearch()">
          </app-search-bar>
          
          <!-- Dropdown de ordenamiento -->
          <app-sort-dropdown
            [sortOptions]="sortOptions"
            [selectedSort]="selectedSort"
            (sortChange)="onSortChange($event)">
          </app-sort-dropdown>
        </div>
      </div>

      <div class="container11" [@shakeError]>
        <div class="background-border2">
          <div class="background5">
            <div class="container2"><div class="table-header-text">Foto</div></div>
            <div class="container2"><div class="table-header-text">Nombre</div></div>
            <div class="container2"><div class="table-header-text">Apellidos</div></div>
            <div class="container2"><div class="table-header-text">Alias</div></div>
            <div class="container2"><div class="table-header-text">Email</div></div>
            <div class="container2"><div class="table-header-text">Departamento</div></div>
            <div class="container2"><div class="table-header-text">Estado</div></div>
            <div class="container2"><div class="table-header-text">Editar</div></div>
            <div class="container2"><div class="table-header-text">Eliminar</div></div>
          </div>

          <div class="container12">
            <!-- Mostrar mensaje si no hay resultados -->
            <div *ngIf="filteredAdmins.length === 0" class="no-results">
              <div class="no-results-content">
                <p>{{ getNoResultsMessage() }}</p>
                <button type="button" (click)="clearSearchAndFilters()" class="clear-search-btn">
                  {{ getClearButtonText() }}
                </button>
              </div>
            </div>

            <!-- Lista dinámica de administradores -->
            <div
              *ngFor="let admin of adminsPaginados; let i = index; trackBy: trackByAdminId"
              class="horizontal-border"
              [class.horizontal-border2]="i > 0">
              <div class="container13">
                <img
                  [ngSrc]="admin.foto ? 'assets/admin/' + admin.foto : 'assets/admin/admin_default.png'"
                  [alt]="'foto de ' + admin.nombre"
                  height="28"
                  width="28"/>
              </div>
              <div class="container2"><div class="table-cell-text">{{ admin.nombre }}</div></div>
              <div class="container2"><div class="table-cell-text">{{ admin.apellidos }}</div></div>
              <div class="container2"><div class="table-cell-text">&#64;{{ admin.alias }}</div></div>
              <div class="container14"><div class="table-cell-text">{{ admin.correo }}</div></div>
              <div class="container2"><div class="table-cell-text">{{ admin.departamento }}</div></div>
              <div class="container15">
                <div class="background-border3">
                  <img
                    [ngSrc]="admin.activo ? 'assets/admin/activo.svg' : 'assets/admin/bloqueado.svg'"
                    [alt]="admin.activo ? 'estado activo' : 'estado bloqueado'"
                    height="18"
                    width="19"/>
                </div>
              </div>
              <div class="container16">
                <button
                  type="button"
                  class="background-border4"
                  (click)="editarAdministrador(admin.id)"
                  [attr.aria-label]="'Editar ' + admin.nombre">
                  <img src="assets/admin/editar.svg" alt="editar administrador" height="18" width="18"/>
                </button>
              </div>
              <div class="container16">
                <button
                  type="button"
                  class="background7"
                  (click)="eliminarAdministrador(admin.id)"
                  [attr.aria-label]="'Eliminar ' + admin.nombre">
                  <img src="assets/admin/eliminar.svg" alt="eliminar administrador" height="18" width="18"/>
                </button>
              </div>
          </div>
          </div>
        </div>
      </div>

      <div class="margin2">
        <div class="container17">
          <div class="container18">
            <div class="text44">Mostrando {{ rangoMostrado }}</div>
          </div>
          <div class="container19">
            <button class="border" [@buttonHover] [@buttonPress] (click)="paginaAnterior()" type="button" aria-label="Ir a la página anterior">
              <div class="iconify-icon4">
                <img class="svg18" ngSrc="assets/admin/anterior.svg" alt="icono anterior" height="18" width="19"/>
              </div>
              <div class="text45">Anterior</div>
            </button>
            <button class="border2" [@buttonHover] [@buttonPress] (click)="paginaSiguiente()" type="button" aria-label="Ir a la página siguiente">
              <div class="text46">Siguiente</div>
              <div class="iconify-icon5">
                <img class="svg19" ngSrc="assets/admin/siguiente.svg" alt="icono siguiente" height="18" width="18"/>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
