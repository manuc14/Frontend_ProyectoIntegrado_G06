<!-- src/app/pages/ad-users/ad-users.component.html -->
<div class="background" [@fadeIn]>

  <app-admin-header [sidebarVisible]="sidebarVisible" (toggleSidebar)="toggleSidebar()"></app-admin-header>

  <div class="container3">
    <app-admin-sidebar [visible]="sidebarVisible" (navigate)="handleNav($event)"></app-admin-sidebar>

    <div class="background4">
      <div class="margin">
        <div class="container7">
          <div class="container8">
            <div class="text8">Usuarios</div>
          </div>
        </div>
      </div>

      <div class="margin">
        <!-- Filtros con botones agrupados -->
        <app-filter-buttons
          [filterGroups]="filterGroups"
          (filterChange)="onFilterChange($event)"
          (clearAll)="onClearAllFilters()">
        </app-filter-buttons>
        
        <div class="search-section">
          <app-search-bar 
            [searchTerm]="searchTerm"
            placeholder="Buscar por nombre, email, alias…"
            ariaLabel="Campo de búsqueda de usuarios"
            (search)="onSearch($event)"
            (clear)="onClearSearch()">
          </app-search-bar>
          
          <!-- Componente de ordenamiento -->
          <app-sort-dropdown
            [sortOptions]="sortOptions"
            [selectedSort]="selectedSort"
            (sortChange)="onSortChange($event)">
          </app-sort-dropdown>
        </div>
      </div>

      <div class="container11" [@shakeError]>
        <div class="background-border2">
          <div class="background5">
            <div class="container2"><div class="table-header-text">Foto</div></div>
            <div class="container2"><div class="table-header-text">Nombre</div></div>
            <div class="container2"><div class="table-header-text">Apellidos</div></div>
            <div class="container2"><div class="table-header-text">Alias</div></div>
            <div class="container2"><div class="table-header-text">Email</div></div>
            <div class="container2"><div class="table-header-text">Fecha de<br />nacimiento</div></div>
            <div class="container2"><div class="table-header-text">Tipo</div></div>
            <div class="container2"><div class="table-header-text">Estado</div></div>
            <div class="container2"><div class="table-header-text">Editar</div></div>
            <!-- Columna Eliminar eliminada por solicitud (se mantiene markup adyacente para no romper layout) -->
          </div>

          <div class="container12">
            <!-- Mostrar mensaje si no hay resultados -->
            <div *ngIf="filteredUsers.length === 0" class="no-results">
              <div class="no-results-content">
                <p>{{ getNoResultsMessage() }}</p>
                <button type="button" (click)="clearSearchAndFilters()" class="clear-search-btn">
                  {{ getClearButtonText() }}
                </button>
              </div>
            </div>

            <!-- Lista dinámica de usuarios -->
            <div
              *ngFor="let user of usuariosPaginados; let i = index; trackBy: trackByItemId"
              class="horizontal-border"
              [class.horizontal-border2]="i > 0">
              <div class="container13">
                <img 
                  [src]="user.photo || 'assets/admin/admin_default.png'" 
                  [alt]="'avatar de ' + user.name" 
                  height="28" 
                  width="28"/>
              </div>
              <div class="container2"><div class="table-cell-text">{{ user.name }}</div></div>
              <div class="container2"><div class="table-cell-text">{{ user.lastName }}</div></div>
              <div class="container2"><div class="table-cell-text">{{ user.alias }}</div></div>
              <div class="container14"><div class="table-cell-text">{{ user.email }}</div></div>
              <div class="container2"><div class="table-cell-text">{{ user.birthDate }}</div></div>
              <div class="container15">
                <div 
                  class="background6" 
                  [class.background8]="user.role === 'Estándar'"
                  [class.background6]="user.role === 'VIP'">
                  <div 
                    class="category-badge" 
                    [class]="user.role === 'Estándar' ? 'est-ndar' : ''">
                    {{ user.role }}
                  </div>
                </div>
              </div>
              <div class="container15">
                <div class="background-border3">
                  <img 
                    [src]="'assets/admin/' + (user.status === 'activo' ? 'activo' : 'bloqueado') + '.svg'" 
                    [alt]="'estado ' + user.status" 
                    height="18" 
                    width="19"/>
                </div>
              </div>
              <div class="container16">
                <button type="button" class="background-border4" (click)="editarUsuario(user.id)" [attr.aria-label]="'Editar ' + user.name">
                  <img 
                    class="svg6" 
                    src="assets/admin/editar.svg" 
                    alt="editar usuario" 
                    height="18" 
                    width="19"/>
                </button>
              </div>
              <!-- Botón Eliminar eliminado por solicitud -->
            </div>
          </div>
        </div>
      </div>

      <div class="margin2">
        <div class="container17">
          <div class="container18">
            <div class="text42">Mostrando {{ rangoMostrado }}</div>
          </div>
          <div class="container19">
            <button 
              class="border" 
              [@buttonHover] 
              [@buttonPress]
              (click)="paginaAnterior()"
              [style.opacity]="currentPage === 1 ? '0.5' : '1'"
              [style.cursor]="currentPage === 1 ? 'not-allowed' : 'pointer'"
              [style.pointer-events]="currentPage === 1 ? 'none' : 'auto'"
              type="button"
              [attr.aria-label]="'Ir a la página anterior'">
              <div class="iconify-icon3">
                <img class="svg18" src="assets/admin/anterior.svg" alt="icono anterior" height="18" width="19"/>
              </div>
              <div class="text43">Anterior</div>
            </button>
            <button 
              class="border2" 
              [@buttonHover] 
              [@buttonPress]
              (click)="paginaSiguiente()"
              [style.opacity]="currentPage === totalPaginas ? '0.5' : '1'"
              [style.cursor]="currentPage === totalPaginas ? 'not-allowed' : 'pointer'"
              [style.pointer-events]="currentPage === totalPaginas ? 'none' : 'auto'"
              type="button"
              [attr.aria-label]="'Ir a la página siguiente'">
              <div class="text44">Siguiente</div>
              <div class="iconify-icon4">
                <img class="svg19" src="assets/admin/siguiente.svg" alt="icono siguiente" height="18"
                     width="18"/>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
