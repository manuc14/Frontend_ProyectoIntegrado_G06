<!-- src/app/pages/ad-users/ad-users.component.html -->
<div class="background" [@fadeIn]>

  <button
    class="sidebar-overlay"
    type="button"
    [class.show]="sidebarVisible"
    (click)="closeSidebar()"
    [attr.aria-label]="'Cerrar menú lateral'">
  </button>

  <div class="background-horizontal-border">
    <div class="header-left">
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="'Abrir menú de navegación'"
        [attr.aria-expanded]="sidebarVisible">
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 12H21M3 6H21M3 18H21" stroke="#3d4656" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="container">
        <div class="iconify-icon">
          <img class="svg" ngSrc="assets/admin/logo_v2.svg" alt="logo ESIMedia" height="32" width="32"/>
        </div>
        <div class="container2">
          <div class="text">ESIMedia</div>
        </div>
      </div>
    </div>

    <div class="container">
      <img class="admin" ngSrc="assets/admin/admin_default.png" alt="foto de usuario actual" height="64" width="60"/>
      <div class="background2">
        <div class="text2">Cerrar sesión</div>
      </div>
    </div>
  </div>

  <div class="container3">
    <div class="background-vertical-border" [class.show]="sidebarVisible">
      <div class="container4">
        <div class="text3">Navegación</div>
      </div>
      <button class="background3" type="button" (click)="navigateToUsers()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="group" ngSrc="assets/admin/usuarios.svg" alt="icono usuarios" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text4">Usuarios</div>
          </div>
        </div>
      </button>
      <button class="container6" type="button" (click)="navigateToAdmins()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="svg3" ngSrc="assets/admin/administradores.svg" alt="icono administradores" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text5">Administradores</div>
          </div>
        </div>
      </button>
      <button class="container6" type="button" (click)="navigateToCreators()" [@buttonHover] [@buttonPress]>
        <div class="container5">
          <div class="iconify-icon">
            <img class="group2" ngSrc="assets/admin/creadores.svg" alt="icono creadores de contenido" width="18" height="18"/>
          </div>
          <div class="container2">
            <div class="text6">Creadores de Contenido</div>
          </div>
        </div>
      </button>
      <button class="container6" type="button">
        <div class="container5">
          <div class="iconify-icon">
            <img class="group3" ngSrc="assets/admin/configuracion.svg" alt="icono configuración" height="18" width="18"/>
          </div>
          <div class="container2">
            <div class="text7">Configuración</div>
          </div>
        </div>
      </button>
    </div>

    <div class="background4">
      <div class="margin">
        <div class="container7">
          <div class="container8">
            <div class="text8">Usuarios</div>
          </div>
        </div>
      </div>

      <div class="margin">
        <!-- Filtros con botones agrupados -->
        <app-filter-buttons
          [filterGroups]="filterGroups"
          (filterChange)="onFilterChange($event)"
          (clearAll)="onClearAllFilters()">
        </app-filter-buttons>

        <div class="search-section">
          <app-search-bar
            [searchTerm]="searchTerm"
            placeholder="Buscar por nombre, email, alias…"
            ariaLabel="Campo de búsqueda de usuarios"
            (search)="onSearch($event)"
            (clear)="onClearSearch()">
          </app-search-bar>

          <!-- Componente de ordenamiento -->
          <app-sort-dropdown
            [sortOptions]="sortOptions"
            [selectedSort]="selectedSort"
            (sortChange)="onSortChange($event)">
          </app-sort-dropdown>
        </div>
      </div>

      <div class="container11" [@shakeError]>
        <div class="background-border2">
          <div class="background5">
            <div class="container2"><div class="text10">Foto</div></div>
            <div class="container2"><div class="text11">Nombre</div></div>
            <div class="container2"><div class="text12">Apellidos</div></div>
            <div class="container2"><div class="text13">Alias</div></div>
            <div class="container2"><div class="text14">Email</div></div>
            <div class="container2"><div class="text15">Fecha de<br />nacimiento</div></div>
            <div class="container2"><div class="text16">Tipo</div></div>
            <div class="container2"><div class="text17">Estado</div></div>
            <div class="container2"><div class="text18">Editar</div></div>
            <div class="container2"><div class="text19">Eliminar</div></div>
          </div>

          <div class="container12">
            <!-- Mostrar mensaje si no hay resultados -->
            <div *ngIf="filteredUsers.length === 0" class="no-results">
              <div class="no-results-content">
                <p>{{ getNoResultsMessage() }}</p>
                <button type="button" (click)="clearSearchAndFilters()" class="clear-search-btn">
                  {{ getClearButtonText() }}
                </button>
              </div>
            </div>

            <!-- Lista dinámica de usuarios -->
            <div
              *ngFor="let user of usuariosPaginados; let i = index; trackBy: trackByUserId"
              class="horizontal-border"
              [class.horizontal-border2]="i > 0">
              <div class="container13">
                <img
                  [ngSrc]="getUserPhoto(user.photo)"
                  [alt]="'foto de ' + user.name"
                  height="28"
                  width="28"
                  (error)="handleImageError($event)"/>
              </div>
              <div class="container2"><div class="text20">{{ user.name }}</div></div>
              <div class="container2"><div class="text21">{{ user.lastName }}</div></div>
              <div class="container2"><div class="text22">{{ user.alias }}</div></div>
              <div class="container14"><div class="text23">{{ user.email }}</div></div>
              <div class="container2"><div class="text24">{{ user.birthDate }}</div></div>
              <div class="container15">
                <div
                  class="background6"
                  [class.background8]="user.role === 'Estándar'"
                  [class.background6]="user.role === 'VIP'">
                  <div
                    class="vip"
                    [class.est-ndar]="user.role === 'Estándar'">
                    {{ user.role }}
                  </div>
                </div>
              </div>
              <div class="container15">
                <div class="background-border3">
                  <img
                    [ngSrc]="'assets/admin/' + (user.status === 'activo' ? 'activo' : 'bloqueado') + '.svg'"
                    [alt]="'estado ' + user.status"
                    height="18"
                    width="19"/>
                </div>
              </div>
              <div class="container16">
                <button class="background-border4"
                     (click)="editarUsuario(user.id)"
                     style="cursor: pointer;"
                     tabindex="0"
                     (keydown)="onEditUserKeyDown($event, user.id)"
                     (keyup)="onEditUserKeyUp($event)">
                  <img
                    class="svg6"
                    ngSrc="assets/admin/editar.svg"
                    alt="editar usuario"
                    height="18"
                    width="19"/>
                </button>
              </div>
              <div class="container16">
                <div class="background7">
                  <img
                    class="svg7"
                    ngSrc="assets/admin/eliminar.svg"
                    alt="eliminar usuario"
                    height="18"
                    width="19"/>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="margin2">
        <div class="container17">
          <div class="container18">
            <div class="text42">Mostrando {{ rangoMostrado }}</div>
          </div>
          <div class="container19">
            <button
              class="border"
              [@buttonHover]
              [@buttonPress]
              (click)="paginaAnterior()"
              [style.opacity]="currentPage === 1 ? '0.5' : '1'"
              [style.cursor]="currentPage === 1 ? 'not-allowed' : 'pointer'"
              [style.pointer-events]="currentPage === 1 ? 'none' : 'auto'"
              tabindex="0"
              (keydown)="onPagePreviousKeyDown($event)"
              (keyup)="onPagePreviousKeyUp($event)">
              <div class="iconify-icon3">
                <img class="svg18" ngSrc="assets/admin/anterior.svg" alt="icono anterior" height="18" width="19"/>
              </div>
              <div class="text43">Anterior</div>
            </button>
            <button
              class="border2"
              [@buttonHover]
              [@buttonPress]
              (click)="paginaSiguiente()"
              [style.opacity]="currentPage === totalPaginas ? '0.5' : '1'"
              [style.cursor]="currentPage === totalPaginas ? 'not-allowed' : 'pointer'"
              [style.pointer-events]="currentPage === totalPaginas ? 'none' : 'auto'"
              tabindex="0"
              (keydown)="onPageNextKeyDown($event)"
              (keyup)="onPageNextKeyUp($event)">
              <div class="text44">Siguiente</div>
              <div class="iconify-icon4">
                <img class="svg19" ngSrc="assets/admin/siguiente.svg" alt="icono siguiente" height="18"
                     width="18"/>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
