<app-header />

<main class="login-page">
  <h1>Iniciar sesión</h1>
  <p class="hint">Accede para continuar viendo y escuchando tu contenido.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card">
    <div *ngIf="bannerKind" class="banner" [class.error]="bannerKind==='error'">{{ bannerText }}</div>

    <label>
      <span>Email *</span>
      <input type="email" formControlName="email" />
      <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">El email es obligatorio.</small>
      <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">Formato de email inválido.</small>
    </label>

    <label>
      <span>Contraseña *</span>
      <input type="password" formControlName="password" />
      <small class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">La contraseña es obligatoria.</small>
    </label>

    <div class="row end">
      <a class="muted" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="actions">
      <button class="btn primary" type="submit" [disabled]="form.invalid || loading">{{ loading ? 'Entrando…' : 'Entrar' }}</button>
      <div class="muted small">¿Nuevo aquí? <a routerLink="/signup">Crear cuenta</a></div>
    </div>
  </form>
</main>
<app-footer />
