<app-header />

<main class="login-page" [@fadeIn]>
  <h1 class="page-title">Iniciar sesión</h1>
  <p class="hint">Accede para continuar viendo y escuchando tu contenido.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card" [@shakeError]="shakeForm ? 'shake' : ''">
    <div *ngIf="bannerKind" class="banner" [class.error]="bannerKind==='error'">{{ bannerText }}</div>

    <label>
      <span>Email *</span>
      <input type="email" formControlName="email"
             [class.invalid]="(f['email'].touched && f['email'].invalid) || bannerKind==='error'"
             [attr.aria-invalid]="((f['email'].touched && f['email'].invalid) || bannerKind==='error') ? true : null"
             [@inputFocus]="getInputFocusState('email')"
             (focus)="onEmailFocus(true)"
             (blur)="onEmailFocus(false)" />
      <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">El email es obligatorio.</small>
      <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">Formato de email inválido.</small>
    </label>

    <label>
      <span>Contraseña *</span>
      <input type="password" formControlName="password"
             [class.invalid]="(f['password'].touched && f['password'].invalid) || bannerKind==='error'"
             [attr.aria-invalid]="((f['password'].touched && f['password'].invalid) || bannerKind==='error') ? true : null"
             [@inputFocus]="getInputFocusState('password')"
             (focus)="onPasswordFocus(true)"
             (blur)="onPasswordFocus(false)" />
      <small class="field-error" *ngIf="f['password'].touched && f['password'].errors?.['required']">La contraseña es obligatoria.</small>
    </label>

    <div class="row end">
      <a class="muted" routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="actions">
      <button class="btn primary" type="submit" 
              [disabled]="form.invalid || loading"
              [@buttonHover]
              [@buttonPress]="buttonState">
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
      <div class="muted small">¿Nuevo aquí? <a routerLink="/signup">Crear cuenta</a></div>
    </div>
  </form>
</main>
<app-footer class="login-footer" />
