<!-- src/app/pages/ad-creator-add/ad-creator-add.component.html -->
<div class="background" [@fadeIn]>
  <div class="overlay">
    <div class="background-border-shadow">
      <form [formGroup]="creatorForm" (ngSubmit)="onSubmit()">
        <div class="horizontal-border">
          <div class="container">
            <div class="text">Añadir creador de contenido</div>
          </div>
          <button class="border" type="button" (click)="goBack()" [@buttonHover] [@buttonPress]>
            <div class="iconify-icon">
              <img class="svg" ngSrc="assets/admin/salir.svg" alt="icono salir" height="18" width="19"/>
            </div>
            <div class="text2">Cerrar</div>
          </button>
        </div>
        <div class="container2">
          <!-- Mensaje de error general -->
          <div *ngIf="errorMessage" class="error-message-box" [@shakeError]>
            {{ errorMessage }}
          </div>
          <!-- Sección de foto -->
          <div class="background2">
            <div class="container4">
              <div class="text3">Foto *</div>
            </div>
            <div class="container5">
              <div class="container6">
                <div class="background3">
                  <div class="svg3" *ngIf="isDefaultIcon">
                    <img class="group" ngSrc="assets/admin/foto_upload.svg" alt="usuario por defecto" height="18" width="18"/>
                  </div>
                  <img
                    *ngIf="!isDefaultIcon"
                    [src]="previewUrl"
                    alt="vista previa"
                    style="width: 56px; height: 56px; border-radius: 48px; object-fit: cover; position: absolute;"/>
                </div>
                <button class="border3" type="button" (click)="openAvatarModal()" [@buttonHover] [@buttonPress]>
                  <div class="container7">
                    <div class="iconify-icon2">
                      <div class="svg3">
                        <img class="group2" ngSrc="assets/admin/img_predefinida.svg" alt="elegir predefinida" height="18" width="19"/>
                      </div>
                    </div>
                    <div class="elegir-predefinida">Elegir predefinida</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
          <!-- Campo Nombre -->
          <div class="background4">
            <div class="container8">
              <div class="text6">Nombre *</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('nombre')" [@inputFocus]>
              <input
                type="text"
                formControlName="nombre"
                class="nombre"
                placeholder="Nombre">
            </div>
          </div>
          <!-- Campo Apellidos -->
          <div class="background5">
            <div class="container8">
              <div class="text7">Apellidos *</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('apellidos')" [@inputFocus]>
              <input
                type="text"
                formControlName="apellidos"
                class="apellidos"
                placeholder="Apellidos">
            </div>
          </div>
          <!-- Campo Email -->
          <div class="background6">
            <div class="container8">
              <div class="text8">Email *</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('email')" [@inputFocus]>
              <input
                type="email"
                formControlName="email"
                class="email-plataforma-com"
                placeholder="email@plataforma.com">
            </div>
          </div>
          <!-- Campo Alias -->
          <div class="background7">
            <div class="paragraph">
              <div class="text9">Alias *</div>
              <div class="text10">(no repetible)</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('alias')" [@inputFocus]>
              <input
                type="text"
                formControlName="alias"
                class="alias-input"
                placeholder="@alias_unico">
            </div>
          </div>
          <!-- Campo Contraseña -->
          <div class="background8">
            <div class="container8">
              <div class="text11">Contraseña *</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('password')" [@inputFocus]>
              <input
                type="password"
                formControlName="password"
                class="div"
                placeholder="••••••••">
            </div>
            <!-- Requisitos de contraseña en tiempo real -->
            <div *ngIf="creatorForm.get('password')?.value" class="password-requirements">
              <div class="requirement-item" *ngFor="let req of passwordRequirements">
                <span class="requirement-icon">✕</span>
                <span class="requirement-text">{{ req }}</span>
              </div>
            </div>
          </div>
          <!-- Campo Repetir contraseña -->
          <div class="background9">
            <div class="container8">
              <div class="text12">Repetir contraseña *</div>
            </div>
            <div class="background-border" [class.error-border]="shouldShowError('repetirPassword')" [@inputFocus]>
              <input
                type="password"
                formControlName="repetirPassword"
                class="div"
                placeholder="••••••••">
            </div>
          </div>
          <!-- Campo Especialidad -->
          <div class="background10">
            <div class="container8">
              <div class="text13">Especialidad *</div>
            </div>
            <div class="background-border2" [class.error-border]="shouldShowError('especialidad')">
              <div class="container9">
                <select formControlName="especialidad" class="text14">
                  <option *ngFor="let esp of especialidades" [value]="esp">{{ esp }}</option>
                </select>
              </div>
              <div class="iconify-icon2">
                <img class="svg4" ngSrc="assets/admin/desplegable.svg" alt="desplegable" height="18" width="19"/>
              </div>
            </div>
          </div>
          <!-- Campo Tipo de contenido -->
          <div class="background11">
            <div class="container8">
              <div class="text15">Tipo de contenido *</div>
            </div>
            <div class="container10" [class.error-border]="shouldShowError('tipoContenido')">
              <button class="background-border3" type="button" (click)="setTipoContenido('audio')" [@buttonHover] [@buttonPress] [class.selected]="creatorForm.get('tipoContenido')?.value === 'audio'">
                <div class="iconify-icon2">
                  <img class="svg5" ngSrc="assets/admin/tipo_creador.svg" alt="selector audio" height="14" width="14"/>
                </div>
                <div class="audio">Audio</div>
              </button>
              <button class="background-border3" type="button" (click)="setTipoContenido('video')" [@buttonHover] [@buttonPress] [class.selected]="creatorForm.get('tipoContenido')?.value === 'video'">
                <div class="iconify-icon2">
                  <img class="svg6" ngSrc="assets/admin/tipo_creador.svg" alt="selector video" height="14" width="14"/>
                </div>
                <div class="video">Video</div>
              </button>
            </div>
            <div class="container11">
              <div class="text16">Solo una opción es válida</div>
            </div>
          </div>
          <!-- Campo Descripción -->
          <div class="background12">
            <div class="container8">
              <div class="text17">Descripción</div>
            </div>
            <div class="background-border4" [@inputFocus]>
              <textarea
                formControlName="descripcion"
                class="breve-bio"
                placeholder="Breve bio o descripción del creador"
                rows="4"></textarea>
            </div>
          </div>
        </div>
        <div class="horizontal-border2">
          <button class="background13" type="button" (click)="goBack()" [@buttonHover] [@buttonPress] [disabled]="isSubmitting">
            <div class="iconify-icon">
              <img class="svg7" ngSrc="assets/admin/eliminar.svg" alt="icono cancelar" height="18" width="19"/>
            </div>
            <div class="text18">Cancelar</div>
          </button>
          <button class="background14" type="submit" [@buttonHover] [@buttonPress] [disabled]="isSubmitting">
            <div class="iconify-icon3">
              <img class="svg8" ngSrc="assets/admin/tick.svg" alt="icono crear" height="18" width="19"/>
            </div>
            <div class="text19">{{ isSubmitting ? 'Creando...' : 'Crear creador' }}</div>
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal de avatares predefinidos -->
  <button *ngIf="showAvatarModal"
       style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;"
       (click)="closeAvatarModal()"
       tabindex="0"
       (keydown)="onCloseAvatarModalKeyDown($event)"
       (keyup)="onCloseAvatarModalKeyUp($event)"
       [@fadeIn]>
    <div style="background: white; border-radius: 16px; width: 90%; max-width: 500px; overflow: hidden; display: flex; flex-direction: column;"
         (click)="$event.stopPropagation()"
         (keydown)="onInnerModalKeyDown($event)"
         (keyup)="onInnerModalKeyUp($event)">
      <div style="padding: 20px; border-bottom: 1px solid #eaedf2; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: #0f172a; font-family: 'NimbusSans-Bold', sans-serif; font-size: 18px; font-weight: 700; margin: 0;">Selecciona un avatar</h3>
        <button type="button" (click)="closeAvatarModal()" style="background: transparent; border: none; cursor: pointer; padding: 4px;">
          <img ngSrc="assets/admin/salir.svg" alt="cerrar" height="18" width="19"/>
        </button>
      </div>
      <div style="padding: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
        <button
          *ngFor="let avatar of availableAvatars"
          class="avatar-item"
          [class.avatar-selected]="selectedAvatar === avatar"
          (click)="selectPredefinedAvatar(avatar)"
          tabindex="0"
          (keydown)="onSelectAvatarKeyDown($event, avatar)"
          (keyup)="onSelectAvatarKeyUp($event)">
          <img [src]="avatar" alt="avatar predefinido" width="100" height="100" style="width: 100%; height: 100%; border-radius: 12px; object-fit: cover;"/>
        </button>
      </div>
    </div>
  </button>
</div>
