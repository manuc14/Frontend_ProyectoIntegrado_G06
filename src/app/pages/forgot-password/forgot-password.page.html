<app-header />

<main class="forgot-password-page" [@fadeIn]>
  <!-- Contenido principal -->
  <section class="main-content">
    <div class="content-header">
      <h1 class="page-title">Restablecer tu contraseña</h1>
    </div>

    <!-- Indicador de progreso -->
    <div class="progress-steps">
      <div class="progress-step active">
        <div class="step-circle current"></div>
        <span class="step-label">Email</span>
      </div>
      <img class="step-arrow" src="assets/icons/play.svg" alt="next" />
      <div class="progress-step">
        <div class="step-circle inactive"></div>
        <span class="step-label">Código</span>
      </div>
      <img class="step-arrow" src="assets/icons/play.svg" alt="next" />
      <div class="progress-step">
        <div class="step-circle inactive"></div>
        <span class="step-label">Nueva Contraseña</span>
      </div>
    </div>

    <!-- Formulario de email -->
    <form [formGroup]="form" (ngSubmit)="onSendCode()" novalidate class="reset-form" [@shakeError]="shakeForm ? 'shake' : ''">
      <div *ngIf="bannerKind" class="banner" [class.error]="bannerKind==='error'">{{ bannerText }}</div>
      
      <div class="form-group">
        <label for="email" class="form-label">Dirección de Email</label>
        <input 
          type="email" 
          formControlName="email" 
          class="form-input"
          placeholder="you@example.com"
          [class.invalid]="f['email'].touched && f['email'].invalid"
          [@inputFocus]="getEmailFocusState()"
          (focus)="onEmailFocus(true)"
          (blur)="onEmailFocus(false)"
        />
        <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['required']">El email es obligatorio.</small>
        <small class="field-error" *ngIf="f['email'].touched && f['email'].errors?.['email']">Formato de email inválido.</small>
      </div>

      <p class="form-description">
        Ingresa el email asociado con tu cuenta de ESIMedia. Te enviaremos un código de 6 dígitos.
      </p>

      <div class="form-actions">
        <button type="submit" class="btn-primary" 
                [disabled]="form.invalid || loading"
                [@buttonHover]
                [@buttonPress]="buttonState">
          <img class="btn-icon" src="assets/icons/shield.svg" alt="Send" />
          <span>{{ loading ? 'Enviando...' : 'Enviar código' }}</span>
        </button>
        <button type="button" class="btn-secondary" (click)="goBackToLogin()">
          Volver al Inicio de Sesión
        </button>
      </div>
    </form>
  </section>
</main>

<app-footer />
