<app-header></app-header>

<div class="reset-code-page">
  <!-- Contenido principal -->
  <div class="main-content">
    <div class="content-header">
      <h1 class="page-title">Verifica el código</h1>
      
      <!-- Indicador de progreso -->
      <div class="progress-steps">
        <div class="progress-step">
          <div class="step-circle completed"></div>
          <span class="step-label">Email</span>
        </div>
        <img src="assets/icons/arrow-right.svg" alt="→" class="step-arrow">
        <div class="progress-step">
          <div class="step-circle current"></div>
          <span class="step-label">Código</span>
        </div>
        <img src="assets/icons/arrow-right.svg" alt="→" class="step-arrow">
        <div class="progress-step">
          <div class="step-circle inactive"></div>
          <span class="step-label">Nueva</span>
        </div>
      </div>
    </div>

    <!-- Formulario de verificación -->
    <div class="reset-form">
      <!-- Banner informativo -->
      <div class="banner" [class.error]="errorMessage">
        <p *ngIf="!errorMessage">
          Te hemos enviado un código de verificación de 6 dígitos a <strong>{{ email }}</strong>. 
          Introdúcelo a continuación para continuar.
        </p>
        <p *ngIf="errorMessage">{{ errorMessage }}</p>
      </div>

      <!-- Campo de código -->
      <div class="form-group">
        <label for="code-input-0" class="form-label">Código de verificación</label>
        <div class="code-inputs">
          <input #codeInput id="code-input-0" class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(0, $event)" (keydown)="onKeyDown(0, $event)" (paste)="onPaste(0, $event)" />
          <input #codeInput class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(1, $event)" (keydown)="onKeyDown(1, $event)" (paste)="onPaste(1, $event)" />
          <input #codeInput class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(2, $event)" (keydown)="onKeyDown(2, $event)" (paste)="onPaste(2, $event)" />
          <input #codeInput class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(3, $event)" (keydown)="onKeyDown(3, $event)" (paste)="onPaste(3, $event)" />
          <input #codeInput class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(4, $event)" (keydown)="onKeyDown(4, $event)" (paste)="onPaste(4, $event)" />
          <input #codeInput class="code-input" type="text" inputmode="numeric" maxlength="1" (input)="onInput(5, $event)" (keydown)="onKeyDown(5, $event)" (paste)="onPaste(5, $event)" />
        </div>
        <div 
          class="field-error" 
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </div>
      </div>

      <p class="form-description">
        El código expira en 10 minutos. Si no lo recibes, revisa tu bandeja de spam o solicita uno nuevo.
      </p>

      <!-- Acciones del formulario -->
      <div class="form-actions">
        <button 
          type="button" 
          class="btn-primary"
          (click)="onSubmit()"
          [disabled]="!canVerify || isLoading"
        >
          <img src="assets/icons/check-circle.svg" alt="Verificar" class="btn-icon" *ngIf="!isLoading">
          <span>{{ isLoading ? 'Verificando...' : 'Verificar código' }}</span>
        </button>
        
        <button 
          type="button" 
          class="btn-secondary"
          (click)="resendCode()"
          [disabled]="isLoading"
        >
          Reenviar código
        </button>
        
        <button 
          type="button" 
          class="btn-secondary"
          (click)="goBack()"
        >
          Volver
        </button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
